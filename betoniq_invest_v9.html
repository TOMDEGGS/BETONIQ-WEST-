<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETONIQ INVEST — Investor Presentation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ===== VIEWPORT-SAFE LAYOUT ===== */
html,body{height:100vh;height:100svh;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#000;color:#fff;display:flex;flex-direction:column}

/* HEADER — fixed 58px */
#hdr{background:linear-gradient(90deg,#08091a,#12103a);padding:7px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00e5ff;height:58px;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#ffd700,#ff8c00);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#000;flex-shrink:0}
.brand-title{font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:1px}
.brand-sub{font-size:0.6rem;color:#888;margin-top:1px}
.hdr-right{text-align:right;font-size:0.65rem;color:#999}
.slide-counter{font-size:1rem;color:#00e5ff;font-weight:700}

/* PROGRESS BAR — 3px */
#prog-bar{height:3px;background:#111;flex-shrink:0;width:100%}
#prog-fill{height:100%;background:#00e5ff;width:6.67%;transition:width 0.4s ease}

/* MAIN CONTENT — fills remaining space exactly */
#main{display:flex;flex:1;overflow:hidden;min-height:0}

/* LEFT — ANIMATION PANEL */
#anim-panel{width:52%;position:relative;overflow:hidden;background:#050b16;flex-shrink:0}

/* RIGHT — TEXT PANEL */
#text-panel{flex:1;background:linear-gradient(160deg,#080a1a,#06080f);padding:22px 24px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid #0f1a2e;overflow:hidden}
.slide-label{font-size:0.6rem;color:#444;text-transform:uppercase;letter-spacing:3px;margin-bottom:8px}
.slide-title{font-size:1.35rem;font-weight:800;color:#fff;line-height:1.25;margin-bottom:12px}
.slide-body{font-size:0.8rem;color:#bbc;line-height:1.65;overflow:hidden}
.play-btn{margin-top:14px;background:rgba(0,229,255,.08);border:1.5px solid #00e5ff;color:#00e5ff;padding:9px 18px;border-radius:22px;cursor:pointer;font-size:0.78rem;display:flex;align-items:center;gap:8px;width:fit-content;flex-shrink:0}
.play-btn:hover{background:#00e5ff22}
.play-dot{width:8px;height:8px;background:#00e5ff;border-radius:50%;animation:blink 1.2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* DATA TABLE */
.data-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:0.67rem}
.data-table th{background:#00e5ff18;color:#00e5ff;padding:4px 7px;text-align:left;border-bottom:1px solid #00e5ff33}
.data-table td{padding:3px 7px;border-bottom:1px solid #0f1a2e;color:#ccc}
.badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:0.6rem;font-weight:700}
.badge-green{background:#00ff8820;color:#00ff88;border:1px solid #00ff8840}
.badge-amber{background:#ffd70020;color:#ffd700;border:1px solid #ffd70040}
.badge-red{background:#ff222220;color:#ff6666;border:1px solid #ff444440}

/* FOOTER CONTROLS — always visible, fixed 52px */
#footer{height:52px;background:#050508;border-top:2px solid #0f1a30;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;flex-shrink:0;width:100%}
.btn{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.2);color:#ccc;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.btn:hover{background:rgba(0,229,255,.12);border-color:#00e5ff;color:#00e5ff}
.btn-play{background:#00e5ff;color:#000 !important;font-weight:800;border-color:#00e5ff;padding:8px 24px}
.btn-play:hover{background:#33eeff}
#auto-btn.active-auto{background:#00ff8822;border-color:#00ff88;color:#00ff88}

/* ========== CSS ANIMATIONS PER SLIDE ========== */

/* SLIDE 1 — Globe with orbiting flags */
.s1-globe{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 40%,#1a6b3c,#0d4a2a,#051a0f);border:2px solid #00e5ff44;position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);animation:globeSpin 8s linear infinite;box-shadow:0 0 40px #00e5ff33}
@keyframes globeSpin{from{box-shadow:0 0 40px #00e5ff33}50%{box-shadow:0 0 70px #00e5ff66}to{box-shadow:0 0 40px #00e5ff33}}
.s1-grid{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:200px;height:200px;border-radius:50%;overflow:hidden;animation:none}
.s1-lat{position:absolute;width:100%;height:1px;background:#00e5ff22;top:var(--t)}
.s1-lon{position:absolute;height:100%;width:1px;background:#00e5ff22;left:var(--l)}
.s1-packet{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd700;box-shadow:0 0 10px #ffd700;animation:orbitPacket var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes orbitPacket{0%{top:var(--oy);left:-10px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:var(--ey);left:calc(100% + 10px);opacity:0}}
.s1-flag{position:absolute;font-size:1.4rem;animation:flagFloat 3s ease-in-out infinite;animation-delay:var(--fd)}
@keyframes flagFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.s1-counter{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);text-align:center;font-size:0.75rem;color:#aaa}
.s1-num{font-size:2rem;font-weight:900;color:#ff4444;text-shadow:0 0 20px #ff4444}
.s1-label{font-size:0.7rem;color:#888;margin-top:4px}

/* SLIDE 2 — David the diaspora investor */
.s2-scene{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.s2-person{font-size:5rem;animation:personPulse 2s ease-in-out infinite}
@keyframes personPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.s2-q{position:absolute;font-size:2rem;animation:qFloat var(--qd) ease-in-out infinite;animation-delay:var(--ql)}
@keyframes qFloat{0%{opacity:0;transform:translate(0,0) scale(0.5)}30%{opacity:1;transform:translate(var(--qx),var(--qy)) scale(1)}70%{opacity:1;transform:translate(var(--qx2),var(--qy2)) scale(1)}100%{opacity:0;transform:translate(var(--qx3),var(--qy3)) scale(0.5)}}
.s2-loss{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);background:#ff000022;border:1px solid #ff4444;border-radius:8px;padding:8px 20px;font-size:1rem;color:#ff4444;font-weight:700;animation:lossPulse 1.5s ease-in-out infinite;white-space:nowrap}
@keyframes lossPulse{0%,100%{box-shadow:0 0 10px #ff444444}50%{box-shadow:0 0 30px #ff4444}}
.s2-city{position:absolute;bottom:0;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.s2-bld{background:linear-gradient(to top,#1a1a3a,#2a2a5a);animation:windowFlash var(--wd) steps(1) infinite;animation-delay:var(--wdl)}
@keyframes windowFlash{0%,90%{filter:brightness(1)}91%,100%{filter:brightness(1.8)}}

/* SLIDE 3 — Platform hub */
.s3-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#0066ff);display:flex;align-items:center;justify-content:center;font-size:1.5rem;animation:hubPulse 2s ease-in-out infinite;box-shadow:0 0 30px #00e5ff66}
@keyframes hubPulse{0%,100%{box-shadow:0 0 30px #00e5ff66}50%{box-shadow:0 0 60px #00e5ffaa}}
.s3-node{position:absolute;width:50px;height:50px;border-radius:50%;background:var(--nc);display:flex;align-items:center;justify-content:center;font-size:1rem;top:var(--ny);left:var(--nx);transform:translate(-50%,-50%);animation:nodePulse 2s ease-in-out infinite;animation-delay:var(--nd)}
@keyframes nodePulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
.s3-line{position:absolute;background:linear-gradient(90deg,transparent,#00e5ff55,transparent);height:1px;transform-origin:left center;top:var(--ly);left:var(--lx);width:var(--lw);transform:rotate(var(--lr));animation:lineFlow 2s linear infinite}
@keyframes lineFlow{0%{background:linear-gradient(90deg,transparent,#00e5ff22,transparent)}50%{background:linear-gradient(90deg,transparent,#00e5ffaa,transparent)}100%{background:linear-gradient(90deg,transparent,#00e5ff22,transparent)}}

/* SLIDE 4 — Neural network AI */
.s4-node{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--nc);animation:aiPulse var(--ad) ease-in-out infinite;animation-delay:var(--adl)}
@keyframes aiPulse{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.5);opacity:1}}
.s4-score{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);text-align:center}
.s4-score-num{font-size:3rem;font-weight:900;color:#00ff88;animation:scoreCount 3s steps(20) infinite}
@keyframes scoreCount{0%{content:'75'}100%{}}
.s4-label{font-size:0.8rem;color:#00ff88;margin-top:4px}

/* SLIDE 5 — Building / Property */
.s5-building{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);width:140px}
.s5-floor{height:24px;background:linear-gradient(90deg,#1a1a4a,#2a2a6a);border:1px solid #3a3a8a;margin-bottom:2px;display:flex;gap:3px;align-items:center;justify-content:center;padding:0 6px}
.s5-window{width:12px;height:14px;background:#333;border:1px solid #444;animation:winLight var(--wl) steps(1) infinite;animation-delay:var(--wld)}
@keyframes winLight{0%,60%{background:#333;border-color:#444}61%,100%{background:#ffd700;border-color:#ffa500;box-shadow:0 0 4px #ffd700}}
.s5-badge{position:absolute;top:12%;right:8%;background:linear-gradient(135deg,#00ff88,#00cc66);border-radius:12px;padding:12px 16px;text-align:center;animation:badgePulse 2s ease-in-out infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 0 15px #00ff8866}50%{box-shadow:0 0 35px #00ff88aa}}
.s5-score{font-size:2rem;font-weight:900;color:#000}
.s5-slabel{font-size:0.6rem;color:#003322;font-weight:700}
.s5-roof{width:160px;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:30px solid #2a2a6a;margin:0 auto}

/* SLIDE 6 — Investment pipeline */
.s6-step{position:absolute;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;text-align:center;color:#fff;border:2px solid var(--sc);background:#000;animation:stepActivate 5s ease-in-out infinite;animation-delay:var(--sd)}
@keyframes stepActivate{0%,19%{border-color:#333;color:#555;box-shadow:none}20%,39%{border-color:var(--sc);color:#fff;box-shadow:0 0 20px var(--sc)}40%,100%{border-color:#33ff8833;color:#33ff88;box-shadow:none}}
.s6-line{position:absolute;height:2px;background:linear-gradient(90deg,#333,var(--lc),#333);animation:lineActivate 5s ease-in-out infinite;animation-delay:var(--ld)}
@keyframes lineActivate{0%,30%{opacity:0.2}31%,60%{opacity:1;box-shadow:0 0 8px var(--lc)}61%,100%{opacity:0.4}}

/* SLIDE 7 — Rate comparison */
.s7-left{position:absolute;left:10%;top:20%;width:35%;text-align:center}
.s7-right{position:absolute;right:5%;top:20%;width:38%;text-align:center}
.s7-rate{font-size:3rem;font-weight:900;animation:rateGlow 2s ease-in-out infinite}
.s7-bank-rate{color:#ff4444;text-shadow:0 0 20px #ff4444}
@keyframes rateGlow{0%,100%{opacity:0.8}50%{opacity:1}}
.s7-good-rate{color:#00ff88;text-shadow:0 0 20px #00ff88}
.s7-label{font-size:0.7rem;color:#888;margin-top:4px}
.s7-packet{position:absolute;top:50%;font-size:1.5rem;animation:packetMove 3s linear infinite}
@keyframes packetMove{0%{left:30%;opacity:0}20%{opacity:1}80%{opacity:1}100%{left:65%;opacity:0}}
.s7-saving{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);background:#00ff8822;border:1px solid #00ff88;border-radius:8px;padding:8px 20px;color:#00ff88;font-weight:700;font-size:0.85rem;animation:savePulse 2s infinite}
@keyframes savePulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}

/* SLIDE 8 — Investor orbits */
.s8-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#ffd700,#ff8c00);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 0 30px #ffd70066;animation:s8hubPulse 2s infinite}
@keyframes s8hubPulse{0%,100%{box-shadow:0 0 30px #ffd70066}50%{box-shadow:0 0 60px #ffd700aa}}
.s8-ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid var(--rc);transform:translate(-50%,-50%);animation:ringRotate var(--rd) linear infinite;animation-delay:var(--rdl)}
@keyframes ringRotate{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.s8-investor{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--ic);display:flex;align-items:center;justify-content:center;font-size:1rem;top:-20px;left:50%;transform:translateX(-50%)}

/* SLIDE 9 — World map routes */
.s9-map{position:absolute;width:90%;height:70%;top:15%;left:5%;background:#0a1628;border:1px solid #1a2a4a;border-radius:8px;overflow:hidden}
.s9-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--dc);box-shadow:0 0 12px var(--dc);transform:translate(-50%,-50%);animation:dotPulse 2s ease-in-out infinite;animation-delay:var(--dd)}
@keyframes dotPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.5)}}
.s9-route{position:absolute;height:2px;background:linear-gradient(90deg,var(--rc),transparent);transform-origin:left center;animation:routeFlow 3s linear infinite;animation-delay:var(--rd)}
@keyframes routeFlow{0%{opacity:0.2;background-size:200% 100%;background-position:100%}50%{opacity:1}100%{opacity:0.2;background-size:200% 100%;background-position:0}}
.s9-packet{position:absolute;width:8px;height:8px;border-radius:50%;background:#ffd700;box-shadow:0 0 8px #ffd700;animation:s9PacketMove var(--pd) linear infinite;animation-delay:var(--pdl)}
@keyframes s9PacketMove{0%{left:var(--px1);top:var(--py1);opacity:0}10%{opacity:1}90%{opacity:1}100%{left:var(--px2);top:var(--py2);opacity:0}}

/* SLIDE 10 — Revenue chart */
.s10-chart{position:absolute;bottom:15%;left:10%;right:10%;height:65%}
.s10-bar{position:absolute;bottom:0;border-radius:4px 4px 0 0;width:18%;background:linear-gradient(to top,var(--bc),var(--bt));animation:barGrow 1.5s ease-out both;animation-delay:var(--bd)}
@keyframes barGrow{from{height:0;opacity:0}to{height:var(--bh);opacity:1}}
.s10-label{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:0.65rem;color:#888}
.s10-value{position:absolute;top:-22px;width:100%;text-align:center;font-size:0.65rem;color:#fff;font-weight:700}
.s10-axis{position:absolute;bottom:0;left:0;right:0;height:1px;background:#333}

/* SLIDE 11 — Growth curve */
.s11-svg{position:absolute;width:90%;height:70%;top:15%;left:5%}
.s11-line-path{stroke:#00e5ff;stroke-width:3;fill:none;stroke-dasharray:600;stroke-dashoffset:600;animation:drawLine 3s ease-out forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.s11-fill-path{fill:#00e5ff11;stroke:none;animation:fillArea 3s ease-out forwards;opacity:0;animation-delay:0.5s}
@keyframes fillArea{to{opacity:1}}

/* SLIDE 12 — Operations nodes */
.s12-node{position:absolute;width:54px;height:54px;border-radius:10px;background:var(--nc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;animation:nodeActive var(--nd) ease-in-out infinite;animation-delay:var(--ndl)}
@keyframes nodeActive{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.4);transform:scale(1.05)}}
.s12-node-icon{font-size:1.2rem}
.s12-node-label{font-size:0.45rem;color:#fff;font-weight:700;text-align:center;line-height:1}
.s12-counter{font-size:0.55rem;color:#00e5ff;font-weight:700}
.s12-packet{position:absolute;width:6px;height:6px;border-radius:50%;background:#00e5ff;box-shadow:0 0 6px #00e5ff;animation:s12flow var(--fd) linear infinite;animation-delay:var(--fl)}
@keyframes s12flow{0%{left:var(--fx1);top:var(--fy1);opacity:0}20%{opacity:1}80%{opacity:1}100%{left:var(--fx2);top:var(--fy2);opacity:0}}

/* SLIDE 13 — Compliance gates */
.s13-gate{position:absolute;width:80px;height:120px;border:2px solid var(--gc);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:gatePulse 3s ease-in-out infinite;animation-delay:var(--gd)}
@keyframes gatePulse{0%,100%{box-shadow:0 0 10px var(--gc)44}50%{box-shadow:0 0 30px var(--gc)}}
.s13-icon{font-size:1.8rem}
.s13-label{font-size:0.6rem;color:#fff;font-weight:700;text-align:center}
.s13-project{position:absolute;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffd700,#ff8c00);display:flex;align-items:center;justify-content:center;font-size:1rem;animation:projectMove 4s linear infinite}
@keyframes projectMove{0%{left:5%;top:50%;transform:translateY(-50%);opacity:0}10%{opacity:1}40%{left:28%;top:50%;transform:translateY(-50%)}60%{left:55%;top:50%;transform:translateY(-50%)}85%{left:75%;top:40%;transform:translateY(-50%)}100%{left:88%;top:40%;opacity:1}}
.s13-pass{position:absolute;right:5%;top:35%;font-size:2rem;animation:passAppear 4s linear infinite}
@keyframes passAppear{0%,60%{opacity:0;transform:scale(0.5)}70%,100%{opacity:1;transform:scale(1)}}

/* SLIDE 14 — Rocket launch */
.s14-rocket{position:absolute;left:50%;animation:rocketLaunch 4s ease-in-out infinite;font-size:3rem}
@keyframes rocketLaunch{0%{bottom:10%;transform:translateX(-50%)}60%{bottom:70%;transform:translateX(-50%) rotate(-5deg)}80%{bottom:75%;transform:translateX(-50%) rotate(0)}100%{bottom:10%;transform:translateX(-50%)}}
.s14-exhaust{position:absolute;left:50%;animation:exhaustAnim 4s ease-in-out infinite;font-size:1.5rem}
@keyframes exhaustAnim{0%{bottom:6%;transform:translateX(-50%);opacity:1}60%{bottom:66%;transform:translateX(-50%);opacity:0.3}100%{bottom:6%;transform:translateX(-50%);opacity:1}}
.s14-star{position:absolute;font-size:1rem;animation:starTwinkle var(--sd) ease-in-out infinite;animation-delay:var(--sdl)}
@keyframes starTwinkle{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
.s14-amount{position:absolute;bottom:15%;right:8%;background:#00ff8822;border:1px solid #00ff88;border-radius:8px;padding:10px 16px;text-align:center;animation:amountPulse 2s infinite}
@keyframes amountPulse{0%,100%{box-shadow:0 0 10px #00ff8844}50%{box-shadow:0 0 25px #00ff88}}
.s14-raise{font-size:1.5rem;font-weight:900;color:#00ff88}
.s14-rlabel{font-size:0.65rem;color:#00cc66}

/* SLIDE 15 — Star burst */
.s15-star{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;background:radial-gradient(circle,#ffd700,#ff8c00,transparent);border-radius:50%;animation:starBurst 2s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:2.5rem}
@keyframes starBurst{0%,100%{box-shadow:0 0 30px #ffd70066,0 0 60px #ffd70033}50%{box-shadow:0 0 60px #ffd700aa,0 0 100px #ffd70066}}
.s15-ray{position:absolute;top:50%;left:50%;height:2px;transform-origin:left center;background:linear-gradient(90deg,#ffd700,transparent);width:120px;transform:rotate(var(--ra)) translateY(-50%);animation:rayPulse 2s ease-in-out infinite;animation-delay:var(--rd)}
@keyframes rayPulse{0%,100%{opacity:0.3;width:120px}50%{opacity:0.8;width:150px}}
.s15-stat{position:absolute;background:#0a0a1a;border:1px solid var(--sc);border-radius:8px;padding:6px 12px;text-align:center;animation:statOrbit var(--sd) linear infinite;animation-delay:var(--sdl)}
@keyframes statOrbit{0%{transform:rotate(var(--sr)) translateX(var(--sx)) rotate(calc(-1 * var(--sr)))}100%{transform:rotate(calc(var(--sr) + 360deg)) translateX(var(--sx)) rotate(calc(-1 * (var(--sr) + 360deg)))}}
.s15-stat-num{font-size:1rem;font-weight:800;color:var(--sc)}
.s15-stat-label{font-size:0.5rem;color:#888}

/* PROGRESS BAR */
#progress-bar{height:3px;background:#111;position:relative;overflow:hidden}
#progress-fill{height:100%;background:#00e5ff;transition:width 0.5s ease}
</style>
</head>
<body>

<div id="hdr">
  <div class="hdr-left">
    <div class="logo-icon">B</div>
    <div>
      <div class="brand-title">BETONIQ INVEST</div>
      <div class="brand-sub">AI-Powered Real Estate Investment Intelligence · 47 Parameters · 11 Countries · $5.1B Pipeline</div>
      <div class="brand-sub">© BETONIQ(WEST) Ltd RC 1496603 · Abuja FCT · STRICTLY CONFIDENTIAL</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="slide-counter" id="counter">1 / 15</div>
    <div>OpenAI Shimmer · Professional Voice</div>
  </div>
</div>

<div id="progress-bar"><div id="progress-fill" style="width:6.67%"></div></div>

<div id="main">
  <div id="anim-panel">
    <!-- Animation injected per slide -->
    <div id="anim-content"></div>
  </div>

function buildTable(t) {
  if (!t) return '';
  let html = '<table class="data-table"><thead><tr>';
  t.heads.forEach(h => html += `<th>${h}</th>`);
  html += '</tr></thead><tbody>';
  t.rows.forEach(r => {
    html += '<tr>';
    r.forEach((c, i) => {
      const badge = i===2 && typeof c === 'string' ? getBadge(c) : c;
      html += `<td>${badge}</td>`;
    });
    html += '</tr>';
  });
  return html + '</tbody></table>';
}

function getBadge(v) {
  if (!v) return v;
  const low = v.toLowerCase();
  if (low.includes('live') || low.includes('active') || low.includes('verified') || low.includes('a+') || low.includes('strong') || low.includes('fast') || low.includes('exceptional') || low.includes('confirmed')) {
    return `<span class="badge badge-green">${v}</span>`;
  }
  if (low.includes('integration') || low.includes('expanding') || low.includes('partial')) {
    return `<span class="badge badge-amber">${v}</span>`;
  }
  if (low.includes('unresolved') || low.includes('fail') || low.includes('reject')) {
    return `<span class="badge badge-red">${v}</span>`;
  }
  return v;
}

function showSlide(n) {
  const s = SLIDES[n];
  document.getElementById('counter').textContent = `${n+1} / ${SLIDES.length}`;
  document.getElementById('slide-label').textContent = `SLIDE ${String(n+1).padStart(2,'0')} / ${SLIDES.length}`;
  document.getElementById('slide-title').textContent = s.title;
  document.getElementById('slide-body').innerHTML = s.body + buildTable(s.table || null);
  document.getElementById('anim-content').innerHTML = ANIMS[s.anim] || '';
  const pf=document.getElementById('prog-fill')||document.getElementById('progress-fill'); if(pf) pf.style.width=((n+1)/SLIDES.length*100)+'%';
  
  // Animate AI score on slide 4
  if (s.anim === 's4') {
    let sc = 75, el = document.getElementById('ai-score');
    if (el) {
      let t = setInterval(() => {
        sc += 1;
        if (el) el.textContent = sc;
        if (sc >= 87) clearInterval(t);
      }, 60);
    }
  }
  
  stopAudio();
}

function playAudio() {
  const a = document.getElementById('audio-player');
  const n = String(cur+1).padStart(2,'0');
  const url = `${BASE}/slide_${n}.mp3`;
  if (a.src !== url) { a.src = url; a.load(); }
  a.play().catch(() => {});
  document.getElementById('play-btn').innerHTML = '<div class="play-dot"></div> ⏸ Playing...';
}

function stopAudio() {
  const a = document.getElementById('audio-player');
  a.pause();
  a.src = '';
  document.getElementById('play-btn').innerHTML = '<div class="play-dot"></div> ▶ PLAY — OpenAI Shimmer professional voice';
}

function onAudioEnd() {
  document.getElementById('play-btn').innerHTML = '<div class="play-dot"></div> ▶ PLAY — OpenAI Shimmer professional voice';
  if (autoPlay && cur < SLIDES.length - 1) {
    autoTimer = setTimeout(() => { navigate(1); setTimeout(playAudio, 500); }, 1000);
  }
}

function navigate(d) {
  cur = Math.max(0, Math.min(SLIDES.length-1, cur+d));
  showSlide(cur);
}

function toggleAuto() {
  autoPlay = !autoPlay;
  const btn = document.getElementById('auto-btn');
  btn.textContent = 'AUTO: ' + (autoPlay ? 'ON ✓' : 'OFF');
  btn.classList.toggle('active-auto', autoPlay);
  if (autoPlay) setTimeout(playAudio, 300);
}

// Swipe
let tx = 0;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX);
document.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) navigate(dx < 0 ? 1 : -1); });
document.addEventListener('keydown', e => { if (e.key==='ArrowRight') navigate(1); if (e.key==='ArrowLeft') navigate(-1); if (e.key===' ') { e.preventDefault(); playAudio(); } });

showSlide(0);
</script>
