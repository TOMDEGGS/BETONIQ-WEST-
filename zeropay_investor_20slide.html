const W = ()=>canvas.width, H = ()=>canvas.height;

function hex(c) { return c; }

function drawChidi() {
  const w=W(),h=H(),ac='#00d4ff';
  ctx.clearRect(0,0,w,h);
  // Pulsing person silhouette center
  const cx=w/2,cy=h*0.38;
  // head
  const pulse = 1 + 0.05*Math.sin(t*2);
  ctx.beginPath(); ctx.arc(cx, cy-60*pulse, 28*pulse, 0, Math.PI*2);
  ctx.fillStyle=ac+'33'; ctx.fill();
  ctx.strokeStyle=ac; ctx.lineWidth=2; ctx.stroke();
  // body
  ctx.beginPath(); ctx.moveTo(cx,cy-32); ctx.lineTo(cx,cy+50);
  ctx.strokeStyle=ac; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-30,cy); ctx.lineTo(cx+30,cy);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy+50); ctx.lineTo(cx-20,cy+90);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy+50); ctx.lineTo(cx+20,cy+90);
  ctx.stroke();
  // floating naira notes
  for(let i=0;i<6;i++) {
    const ang = t*0.5 + i*Math.PI/3;
    const r = 80 + 20*Math.sin(t+i);
    const nx = cx + r*Math.cos(ang);
    const ny = cy + r*Math.sin(ang)*0.5;
    ctx.fillStyle='#fbbf24';
    ctx.font='bold 16px Arial';
    ctx.fillText('₦',nx,ny);
  }
  // question marks bouncing
  ['?','?','?'].forEach((q,i)=>{
    const x = cx-80+i*80;
    const y = h*0.65 + 20*Math.sin(t*1.5+i);
    ctx.fillStyle='#ff4444';
    ctx.font='bold 28px Arial';
    ctx.fillText(q,x,y);
  });
  // icon large
  ctx.font='60px Arial'; ctx.fillStyle='#ffffff22';
  ctx.fillText('👨‍💼',cx-30,h*0.18);

function drawPartners() {
  const w=W(),h=H(),ac='#10b981';
  ctx.clearRect(0,0,w,h);
  const partners=['Speedinvest','Techstars','Atomico','Paystack','Gates Fdn','Onafriq'];
  partners.forEach((p,i)=>{
    const ang=t*0.4+i*Math.PI/3;
    const r=95;
    const cx=w/2,cy=h/2;
    const x=cx+r*Math.cos(ang);
    const y=cy+r*Math.sin(ang);
    ctx.beginPath(); ctx.arc(x,y,28,0,Math.PI*2);
    ctx.fillStyle=ac+'22'; ctx.fill();
    ctx.strokeStyle=ac; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='8px Arial'; ctx.textAlign='center';
    ctx.fillText(p,x,y+3);
    ctx.strokeStyle=ac+'33'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x-28*Math.cos(ang),y-28*Math.sin(ang)); ctx.stroke();
  });
  ctx.beginPath(); ctx.arc(w/2,h/2,22,0,Math.PI*2);
  ctx.fillStyle=ac+'44'; ctx.fill();
  ctx.strokeStyle=ac; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 9px Arial'; ctx.textAlign='center';
  ctx.fillText('ZP',w/2,h/2+4);
  ctx.textAlign='left';
}

function drawClose() {
  const w=W(),h=H(),ac='#fbbf24';
  ctx.clearRect(0,0,w,h);
  // Star burst
  const cx=w/2,cy=h*0.42;
  for(let i=0;i<12;i++){
    const ang=t*0.5+i*Math.PI/6;
    const r1=30,r2=80+20*Math.sin(t*2+i);
    ctx.strokeStyle=ac+(i%2===0?'ff':'66'); ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(cx+r1*Math.cos(ang),cy+r1*Math.sin(ang));
    ctx.lineTo(cx+r2*Math.cos(ang),cy+r2*Math.sin(ang));
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx,cy,28,0,Math.PI*2);
  ctx.fillStyle=ac+'44'; ctx.fill();
  ctx.strokeStyle=ac; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 13px Arial'; ctx.textAlign='center';
  ctx.fillText('ZP',cx,cy+5);
  // Orbiting stats
  const stats=['$4.5M','Sep 2026','147 FX','5-Layer','PUF','72hr'];
  stats.forEach((s,i)=>{
    const ang=t*0.6+i*Math.PI/3;
    const r=120;
    const x=cx+r*Math.cos(ang);
    const y=cy+r*Math.sin(ang);
    ctx.fillStyle=ac; ctx.font='bold 11px Arial';
    ctx.fillText(s,x-15,y);
  });
  ctx.fillStyle='#fff'; ctx.font='bold 14px Arial';
  ctx.fillText('The World is Watching',cx,h*0.85);
  ctx.textAlign='left';
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function playAudio(){
  const s=SLIDES[cur];
  if(audio){audio.pause();audio=null;}
  if(s.audio){
    audio=new Audio(s.audio);
    audio.play().catch(()=>{});
    document.getElementById('play-label').textContent='⏸ Playing...';
    audio.onended=()=>{document.getElementById('play-label').textContent='▶ PLAY — OpenAI Shimmer professional voice'; if(autoMode) setTimeout(nextSlide,1500);};
  }
}

function nextSlide(){if(cur<19){cur++;updateUI();if(autoMode)playAudio();}}
function prevSlide(){if(cur>0){cur--;updateUI();if(autoMode)playAudio();}}
function toggleAuto(){autoMode=!autoMode;document.getElementById('auto-btn').textContent='AUTO: '+(autoMode?'ON':'OFF');if(autoMode)playAudio();}

// Keyboard nav
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextSlide();if(e.key==='ArrowLeft')prevSlide();});

// Touch/swipe
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){if(dx<0)nextSlide();else prevSlide();}},{passive:true});

// Init
window.addEventListener('load',()=>{setTimeout(()=>{resizeCanvas();updateUI();},200);});
</script>
