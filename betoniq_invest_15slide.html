<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>BETONIQ INVEST — AI Real Estate Investment Platform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#050d1a;color:#e8ecf0;height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0d1b3e,#1a2a4e);padding:9px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #ffa500;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.brand{display:flex;flex-direction:column}
.brand-name{font-size:19px;font-weight:900;color:#ffa500;letter-spacing:1.5px}
.brand-sub{font-size:10px;color:#90a4b7;margin-top:1px;letter-spacing:.5px}
.brand-legal{font-size:8px;color:#607080;margin-top:2px}
.hdr-right{text-align:right}
.slide-counter{font-size:13px;color:#ffa500;font-weight:900}
.ai-badge{font-size:9px;color:#00d4ff;margin-top:2px}

/* PROGRESS */
.progress-bar{height:5px;background:#0d1b3e;flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,#ffa500,#ff6f00,#ffd54f);transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(255,165,0,.5)}

/* SLIDE AREA */
.slide-wrap{flex:1;position:relative;overflow:hidden}
.slide{display:none;flex-direction:column;justify-content:center;align-items:center;padding:28px 44px;text-align:center;position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.slide.active{display:flex;opacity:1}
.slide-icon{font-size:62px;margin-bottom:14px;filter:drop-shadow(0 0 16px rgba(255,165,0,.5));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 16px rgba(255,165,0,.4))}50%{filter:drop-shadow(0 0 28px rgba(255,165,0,.8))}}
.slide-num{font-size:10px;font-weight:700;letter-spacing:3px;color:#607080;margin-bottom:7px}
.slide-title{font-size:24px;font-weight:900;color:#ffa500;margin-bottom:14px;line-height:1.25;text-shadow:0 0 20px rgba(255,165,0,.3)}
.slide-text{font-size:13.5px;line-height:1.8;max-width:800px;color:#cdd6e0;opacity:.92}

/* NARRATION STATUS */
.narr-status{margin-top:14px;background:rgba(255,165,0,.07);border:1px solid rgba(255,165,0,.2);border-radius:10px;padding:9px 18px;font-size:11px;color:#ffa500;max-width:680px;display:flex;align-items:center;gap:8px}
.narr-dot{width:8px;height:8px;border-radius:50%;background:#ffa500;flex-shrink:0;transition:all .3s}
.narr-dot.speaking{animation:blink .6s ease-in-out infinite;background:#00d4ff}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* THUMBNAIL STRIP */
.thumb-strip{background:#030a14;border-top:1px solid #1e3a5f;display:flex;overflow-x:auto;padding:5px 8px;gap:5px;flex-shrink:0;scrollbar-width:thin;scrollbar-color:#1e3a5f transparent}
.thumb{border-radius:6px;border:2px solid #1e3a5f;padding:5px 9px;font-size:9px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .25s;flex-shrink:0;color:#607080}
.thumb:hover{border-color:#ffa50055;color:#ffa500}
.thumb.active{border-color:#ffa500;color:#ffa500;background:rgba(255,165,0,.1)}
.thumb.done{border-color:#ffa50033;color:#ffa50077}

/* CONTROLS */
.controls{background:#030a14;border-top:2px solid #1e3a5f;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.btn{background:#0d1b3e;border:1.5px solid #1e3a5f;border-radius:8px;color:#cdd6e0;font-size:11px;font-weight:700;padding:9px 14px;cursor:pointer;transition:all .2s;white-space:nowrap;touch-action:manipulation}
.btn:hover{background:#1e3a5f;border-color:#ffa500;color:#ffa500}
.btn:active{transform:scale(.95)}
.btn-play{background:linear-gradient(135deg,#e65100,#ffa500);border:none;color:#fff;font-size:13px;font-weight:900;padding:10px 24px;border-radius:10px;letter-spacing:.5px;box-shadow:0 2px 12px rgba(255,120,0,.4)}
.btn-play:hover{background:linear-gradient(135deg,#ff6f00,#ffd54f);box-shadow:0 4px 18px rgba(255,150,0,.5)}
.btn-auto{font-size:10px;padding:7px 12px}
.btn-auto.active{background:#ffa50022;border-color:#ffa500;color:#ffa500}
.dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#1e3a5f;cursor:pointer;transition:all .25s;touch-action:manipulation}
.dot.active{background:#ffa500;transform:scale(1.5);box-shadow:0 0 6px rgba(255,165,0,.6)}
.dot.done{background:rgba(255,165,0,.35)}
.voice-info{font-size:9px;color:#40566a;text-align:right;line-height:1.4;min-width:85px}

@media(max-width:640px){
  .slide{padding:18px 16px}
  .slide-icon{font-size:44px;margin-bottom:10px}
  .slide-title{font-size:17px;margin-bottom:10px}
  .slide-text{font-size:12px;line-height:1.7}
  .controls{gap:7px;padding:8px 10px}
  .btn{padding:8px 11px;font-size:10px}
  .btn-play{padding:10px 18px;font-size:12px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="brand">
    <div class="brand-name">🏗️ BETONIQ INVEST</div>
    <div class="brand-sub">AI-Powered Real Estate Investment Intelligence</div>
    <div class="brand-legal">© BETONIQ(WEST) Ltd RC 56802 · Abuja, FCT, Nigeria · Confidential</div>
  </div>
  <div class="hdr-right">
    <div class="slide-counter">Slide <span id="sCurr">1</span> / 15</div>
    <div class="ai-badge">47-Parameter AI Scoring Engine</div>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="prog" style="width:6.67%"></div></div>

<div class="slide-wrap" id="slideWrap"></div>

<div class="thumb-strip" id="thumbStrip"></div>

<div class="controls">
  <button class="btn" onclick="go(-1)">◀ PREV</button>
  <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶ PLAY NARRATION</button>
  <button class="btn" onclick="go(1)">NEXT ▶</button>
  <button class="btn btn-auto" id="autoBtn" onclick="toggleAuto()">AUTO-ADVANCE: OFF</button>
  <div class="dots" id="dots"></div>
  <div class="voice-info" id="voiceInfo">Loading voice...</div>
</div>

<script>
const SLIDES = ["There are 1.4 billion people globally who have no reliable access to formal financial services. In Nigeria alone, 38 million people are excluded from the banking system. But this story is not just about the unbanked. It is about the under-invested. Every year, 47 million Nigerians in the diaspora want to invest back home. $26 billion in remittances flows into Nigeria annually \u2014 but almost none of it goes into verified, structured real estate investment. The infrastructure does not exist. Until now.", "Meet David. A Nigerian software engineer in Manchester, earning \u00a365,000 a year. He has watched his parents' property in Lekki triple in value over 10 years. He knows Nigeria's real estate market delivers 29% average returns. He finds a project in Katampe, Abuja \u2014 but there is no projected ROI, no NPV, no IRR. Just a brochure and a bank account number. His cousin invested \u00a312,000 in a Lekki development two years ago. The project was never built. The developer disappeared. The money is gone. David does nothing. Nigeria loses the capital. Everyone loses.", "BETONIQ(WEST) INVEST is an AI-powered real estate investment platform built specifically to bridge global capital to verified African real estate opportunities. Built by Tom Ugbodaga \u2014 a physicist, cybersecurity specialist, and inventor of ZerôPâŷ Money, the world's first offline contactless payment system. Masters in NFC for Contactless Technology, University of Gloucestershire 2011 \u2014 Best Result in Cohort. The platform holds 70 curated projects across 11 countries. Total pipeline: $5.1 billion USD. Average AI score: 89 out of 100. Average projected ROI: 29%.", "Every project on BETONIQ INVEST is scored across 47 distinct parameters before it is visible to investors. Category one \u2014 Location Intelligence: population density trends, urbanisation rate, proximity to employment hubs, transport links, and infrastructure investment pipelines. Category two \u2014 Developer Track Record: CAC registration, previous project completions, litigation history, and financial disclosures. Category three \u2014 Regulatory Compliance: Certificate of Occupancy, building permits, environmental impact assessment, and FAAN clearances. Category four \u2014 Financial Viability: NPV, IRR, Break-Even, Payback Period, and projected ROI \u2014 all independently calculated. Category five \u2014 Market Demand: absorption rates, competing supply, rental yield data, and buyer demographics.", "David logs into BETONIQ INVEST. He filters \u2014 Nigeria, \u00a310,000 to \u00a320,000, ROI above 25%. Three projects appear. The first: Katampe Terrace, Abuja. 9 residential units. AI Score: 87 out of 100. Projected ROI: 28%. Net Present Value: $198,000. IRR: 31%. Regulatory status: green \u2014 Certificate of Occupancy verified. Developer track record: 4 completed projects, zero litigation history. Break-even: 18 months. David reads the full feasibility study \u2014 generated by the platform, not by the developer. For the first time in three years of trying, David trusts what he is looking at.", "Step one \u2014 KYC and Accreditation. David submits identity documents. The system verifies against international anti-money-laundering databases. Under 24 hours. Step two \u2014 Investment Commitment. David selects Katampe Terrace and commits \u00a315,000. Step three \u2014 Smart Contract. The platform generates a legally binding contract. Both parties sign digitally. Timestamped, encrypted, stored. Step four \u2014 Protected Fund Release. Capital is released in tranches tied to construction milestones \u2014 foundation, structural frame, roofing, finishing, handover. Never in a lump sum. Step five \u2014 Verified Returns. David invested \u00a315,000. Katampe Terrace completes in 22 months. Return: \u00a34,200 \u2014 28% exactly as projected.", "Meet Emmanuel. A developer in Abuja with CAC registration, planning permission, and a cleared site in Gwarinpa. 12 residential units. AI Score: 91 out of 100. Nigerian commercial banks are offering him construction finance at 22% interest per annum. This makes his project financially unviable. Emmanuel lists on BETONIQ INVEST. His AI score, feasibility study, and compliance records are verified and visible to global investors. Within 60 days, four investors from the UK, US, Canada, and UAE commit a combined $280,000. Emmanuel breaks ground at a blended cost of capital of 14% \u2014 viable, profitable, scalable. Without BETONIQ INVEST, Emmanuel's project never gets built. With it, 12 Nigerian families have homes.", "BETONIQ INVEST targets four distinct investor categories. One \u2014 Nigerian diaspora investors in the UK, US, and Canada seeking verified home-country exposure with professional due diligence and legal protection. Two \u2014 African high-net-worth individuals seeking structured, scored investment opportunities with full audit trails. Three \u2014 Institutional investors and family offices seeking African emerging market real estate allocation with quantified risk metrics. Four \u2014 International impact investors seeking infrastructure and housing exposure in high-growth African markets. Minimum investment: $10,000 USD. No maximum. Every investor receives quarterly digital performance reports.", "BETONIQ INVEST currently operates across Nigeria, Ghana, Kenya, South Africa, the United Kingdom, UAE, United States, Canada, Germany, France, and Australia. Nigeria is the primary market \u2014 45 projects listed. Ghana: 8 projects. Kenya: 5 projects. South Africa: 4 projects. United Kingdom: 3 projects. UAE: 2 projects. 6 additional West African and East African markets in compliance review. Total verified pipeline: $5.1 billion USD across 70 projects. Every project has passed the 47-parameter AI scoring process and achieved a minimum feasibility score of 75 out of 100. Target by Q4 2026: 500 projects across 25 countries.", "BETONIQ INVEST operates a transparent three-tier revenue model. Tier one \u2014 Developer Listing Fees: developers pay $5,000 to $50,000 depending on listing tier \u2014 Basic, Premium, or Enterprise. Tier two \u2014 Success Fees: on each completed investment transaction, BETONIQ charges 1.5 to 3 percent of the investment value. Tier three \u2014 Investor Subscriptions: investors access premium AI reports, portfolio analytics, and compliance documents through monthly plans starting at $49 per month. Gross margin across all three revenue streams: 72 percent. This is a high-margin, scalable SaaS model applied to real estate.", "Phase one \u2014 2026: Nigerian market launch, 70 projects, $2.5 million developer listing revenue, $180,000 subscription revenue. Phase two \u2014 2027: West Africa and East Africa expansion, 250 projects, $12 million developer listing revenue, $850,000 subscription revenue. Phase three \u2014 2028: UK and UAE diaspora institutional programme, 500 projects, $35 million developer listing revenue, $4.5 million subscription revenue. Total projected three-year revenue: $55 million. Gross margin: 72 percent. BETONIQ INVEST will be the Bloomberg of African real estate investment by 2028.", "BETONIQ INVEST is not a concept. It is fully operational right now. The platform processes live investor registrations, real-time AI scoring calculations, compliance document verification, and subscription billing simultaneously. The backend is powered by 11 entity types, 6 backend functions, and a real-time AI scoring API. Investors can register, browse projects, view AI scores, access feasibility studies, and initiate investment enquiries today. The compliance engine is live. The investor CRM is operational. The platform runs on enterprise-grade infrastructure \u2014 the same stack powering ZerôPâŷ Money's offline payment engine. No traditional engineering team required.", "Every project on BETONIQ INVEST undergoes mandatory regulatory compliance verification before listing. Our compliance framework covers: company registration and local licensing verification, planning permission and building approval checks, environmental impact assessment review, anti-money laundering and KYC verification for all parties, and investor accreditation status confirmation. Every project is assigned a compliance score from 0 to 100. Projects below 80 do not receive investment listing approval. The compliance panel review is independent of the AI scoring system \u2014 both must pass for a project to go live. This two-gate system is what makes BETONIQ INVEST uniquely trusted.", "BETONIQ INVEST is seeking $4.5 million US dollars in Pre-Series A investment at a pre-money valuation of $25 million \u2014 18 percent equity. Use of funds: Product development $1.2 million \u2014 AI engine enhancement, mobile application, API partner integrations. Market expansion $1.5 million \u2014 Nigeria, Ghana, and Kenya developer partnerships and compliance registration. Investor acquisition $800,000 \u2014 diaspora marketing, institutional investor relations, and partnership events. Operations $1 million \u2014 team, compliance, legal, and banking infrastructure. Return to investor at Series A in 18 months: projected 3x on a $75 million post-money valuation.", "BETONIQ INVEST is the world's first AI-powered real estate investment selection platform for African and emerging markets. 70 live projects. 11 countries. $5.1 billion pipeline. 29 percent average target ROI. A 47-parameter AI scoring engine that no competitor can replicate in under three years. A fully operational platform with live investor registrations, compliance verification, and real-time AI scoring. A solo founder who built institutional-grade financial infrastructure without a traditional engineering team. We are not pitching a concept. We are presenting a live platform seeking growth capital to scale to the 500-project, 25-country, institutional-grade investment marketplace that African real estate deserves. Join us."];
const TITLES = ["The Problem \u2014 47 Million Missed Investments", "Meet David \u2014 The Diaspora Investor Locked Out", "Introducing BETONIQ INVEST \u2014 AI-Powered Real Estate Intelligence", "The 47-Parameter AI Scoring Engine", "Live Example \u2014 Katampe Terrace, Abuja", "The Investment Process \u2014 Five Protected Steps", "For Developers \u2014 Access Global Capital", "Four Investor Categories \u2014 Global Capital Pool", "Current Portfolio \u2014 11 Countries, $5.1 Billion Pipeline", "Revenue Model \u2014 Three Streams", "Three-Phase Growth \u2014 $55M Projected Revenue", "Platform \u2014 Live and Fully Operational Today", "Regulatory & Compliance Architecture", "Pre-Series A \u2014 $4.5M Ask at $25M Valuation", "The Opportunity \u2014 Join the Bloomberg of African Real Estate"];
const ICONS = ["\ud83c\udf0d", "\ud83d\udc68\u200d\ud83d\udcbc", "\ud83c\udfd7\ufe0f", "\ud83e\udd16", "\ud83c\udfe2", "\u2705", "\ud83d\udc77", "\ud83d\udcbc", "\ud83d\uddfa\ufe0f", "\ud83d\udcb0", "\ud83d\udcc8", "\ud83d\udda5\ufe0f", "\u2696\ufe0f", "\ud83d\ude80", "\u2b50"];
const COLORS = ["#1a237e", "#0d47a1", "#4a148c", "#1b5e20", "#004d40", "#006064", "#e65100", "#880e4f", "#0277bd", "#2e7d32", "#c62828", "#1565c0", "#4527a0", "#00695c", "#b71c1c"];
const TOTAL = SLIDES.length;

let cur = 0, speaking = false, autoAdvance = false;
let synth = window.speechSynthesis, voices = [], chosenVoice = null, utt = null;

// Build DOM
const wrap = document.getElementById('slideWrap');
const dots = document.getElementById('dots');
const thumbs = document.getElementById('thumbStrip');

SLIDES.forEach((text, i) => {
  // Slide
  const s = document.createElement('div');
  s.className = 'slide' + (i===0?' active':'');
  s.id = 'sl'+i;
  s.style.background = `linear-gradient(160deg,${COLORS[i]}28 0%,#050d1a 70%)`;
  s.innerHTML = `
    <div class="slide-icon">${ICONS[i]}</div>
    <div class="slide-num">${String(i+1).padStart(2,'0')} / ${String(TOTAL).padStart(2,'0')}</div>
    <div class="slide-title">${TITLES[i]}</div>
    <div class="slide-text">${text}</div>
    <div class="narr-status" id="ns${i}">
      <div class="narr-dot" id="nd${i}"></div>
      <span id="nt${i}">Press ▶ PLAY NARRATION to hear the professional audio for this slide</span>
    </div>`;
  wrap.appendChild(s);

  // Dot
  const d = document.createElement('div');
  d.className = 'dot'+(i===0?' active':'');
  d.id = 'dt'+i;
  d.title = TITLES[i];
  d.onclick = () => jumpTo(i);
  dots.appendChild(d);

  // Thumb
  const t = document.createElement('div');
  t.className = 'thumb'+(i===0?' active':'');
  t.id = 'th'+i;
  t.textContent = (i+1)+'. '+TITLES[i].split('—')[0].trim();
  t.onclick = () => jumpTo(i);
  thumbs.appendChild(t);
});

// Voice initialisation — prioritise female British/professional voices
const VOICE_PRIORITY = [
  'Google UK English Female',
  'Microsoft Hazel - English (United Kingdom)',
  'Microsoft Susan - English (United Kingdom)',
  'Serena',
  'Kate',
  'Moira',
  'Samantha',
  'Victoria',
  'Google US English Female',
  'Microsoft Zira',
  'Microsoft Jenny'
];

function pickVoice() {
  voices = synth.getVoices();
  if (!voices.length) return;
  for (const name of VOICE_PRIORITY) {
    const v = voices.find(v => v.name.includes(name));
    if (v) { chosenVoice = v; break; }
  }
  if (!chosenVoice) chosenVoice = voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang==='en-US'&&v.name.toLowerCase().includes('female')) || voices.find(v=>v.lang.startsWith('en')) || voices[0];
  document.getElementById('voiceInfo').innerHTML = chosenVoice
    ? `Voice:<br>${chosenVoice.name.split(' ').slice(0,3).join(' ')}`
    : 'Voice: Browser default';
}
pickVoice();
if ('onvoiceschanged' in synth) synth.onvoiceschanged = pickVoice;

function setNarrStatus(idx, state, text) {
  const dot = document.getElementById('nd'+idx);
  const txt = document.getElementById('nt'+idx);
  if (!dot||!txt) return;
  dot.className = 'narr-dot'+(state==='speaking'?' speaking':'');
  dot.style.background = state==='speaking'?'#00d4ff': state==='done'?'#00c853':'#ffa500';
  txt.textContent = text;
}

function speak(idx) {
  if (!synth) return;
  synth.cancel();
  utt = new SpeechSynthesisUtterance(SLIDES[idx]);
  if (chosenVoice) utt.voice = chosenVoice;
  utt.rate = 0.86;
  utt.pitch = 1.05;
  utt.volume = 1.0;
  utt.onstart = () => {
    speaking = true;
    document.getElementById('playBtn').textContent = '⏸ PAUSE';
    setNarrStatus(idx, 'speaking', '🔊 Playing narration for slide '+(idx+1)+'...');
    document.getElementById('voiceInfo').innerHTML = '🔊 Speaking...';
  };
  utt.onend = () => {
    speaking = false;
    setNarrStatus(idx, 'done', '✅ Narration complete');
    document.getElementById('voiceInfo').innerHTML = '✓ Done';
    if (autoAdvance && idx < TOTAL-1) {
      setTimeout(() => { jumpTo(idx+1); speak(idx+1); }, 1000);
    } else {
      document.getElementById('playBtn').textContent = '▶ PLAY NARRATION';
      if (idx === TOTAL-1 && autoAdvance) {
        autoAdvance = false;
        document.getElementById('autoBtn').textContent = 'AUTO-ADVANCE: OFF';
        document.getElementById('autoBtn').classList.remove('active');
      }
    }
  };
  utt.onerror = (e) => {
    speaking = false;
    setNarrStatus(idx, 'error', '⚠ Audio error — tap PLAY again');
    document.getElementById('playBtn').textContent = '▶ PLAY NARRATION';
  };
  // iOS Safari keepalive hack
  synth.speak(utt);
  if (/iP(hone|od|ad)/.test(navigator.userAgent)) {
    setTimeout(() => { if (synth.speaking) { synth.resume(); } }, 300);
    const keepAlive = setInterval(() => {
      if (!synth.speaking) { clearInterval(keepAlive); return; }
      synth.pause(); synth.resume();
    }, 12000);
  }
}

function togglePlay() {
  if (speaking) {
    synth.cancel(); speaking = false;
    document.getElementById('playBtn').textContent = '▶ PLAY NARRATION';
    setNarrStatus(cur, 'idle', 'Paused — press ▶ to resume');
    return;
  }
  speak(cur);
}

function toggleAuto() {
  autoAdvance = !autoAdvance;
  const btn = document.getElementById('autoBtn');
  btn.textContent = 'AUTO-ADVANCE: '+(autoAdvance?'ON':'OFF');
  btn.className = 'btn btn-auto'+(autoAdvance?' active':'');
  if (autoAdvance && !speaking) speak(cur);
}

function go(dir) {
  const next = Math.max(0, Math.min(TOTAL-1, cur+dir));
  if (next===cur) return;
  jumpTo(next);
  if (autoAdvance||speaking) speak(next);
}

function jumpTo(idx) {
  synth.cancel(); speaking = false;
  ['sl','dt','th'].forEach(pfx => {
    document.getElementById(pfx+cur)?.classList.remove('active');
    document.getElementById(pfx+cur)?.classList.add('done');
  });
  cur = idx;
  ['sl','dt','th'].forEach(pfx => {
    document.getElementById(pfx+cur)?.classList.add('active');
    document.getElementById(pfx+cur)?.classList.remove('done');
  });
  document.getElementById('sCurr').textContent = cur+1;
  document.getElementById('prog').style.width = (((cur+1)/TOTAL)*100)+'%';
  if (!autoAdvance) {
    document.getElementById('playBtn').textContent = '▶ PLAY NARRATION';
    setNarrStatus(cur, 'idle', 'Press ▶ PLAY NARRATION to hear the professional audio for this slide');
  }
  document.getElementById('voiceInfo').innerHTML = 'Slide '+(cur+1)+' ready';
  document.getElementById('th'+cur)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); go(1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key.toLowerCase()==='p') togglePlay();
  else if (e.key.toLowerCase()==='a') toggleAuto();
});

// Touch swipe
let tx = 0;
document.getElementById('slideWrap').addEventListener('touchstart', e=>{tx=e.touches[0].clientX;}, {passive:true});
document.getElementById('slideWrap').addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx)>60) go(dx<0?1:-1);
}, {passive:true});
</script>
</body>
</html>
