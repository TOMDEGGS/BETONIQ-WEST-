function drawChidi3D(){
  const w=W(),h=H(),cx=w/2;
  // Lagos skyline 3D

    const x=bx*w,y=by*h,W2=bw*w,H2=bh*h;
    const isLeft=idx<3;
    ctx.fillStyle=isLeft?'#06101a':'#061512';

  ctx.restore();

    const a=t*.4+i*Math.PI/4, r=70+15*Math.sin(t+i*1.2);

  const active=Math.floor(t*.55)%6;

function drawRaise3D(){
  const w=W(),h=H(),cx=w/2;
  const ry=h*(.78-Math.min(.65,t*.08));
  for(let i=0;i<30;i++){const sx=((i*317+t*22*(1+i%3*.5))%w),sy=((i*211)%h),ss=.5+i%3*.4;ctx.fillStyle=`rgba(255,255,255,${.2+.4*(i%2)})`;ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fill();}
  for(let i=0;i<14;i++){const ex=cx+((i%2===0?-1:1)*(Math.random()*22)),ey=ry+55+i*9,alpha=Math.max(0,.9-i*.07);ctx.beginPath();ctx.arc(ex,ey,5+Math.random()*6,0,Math.PI*2);ctx.fillStyle=`rgba(255,${80+i*13},0,${alpha})`;ctx.fill();}
  const rb=ctx.createLinearGradient(cx-18,ry,cx+18,ry+56);rb.addColorStop(0,'#ef5350');rb.addColorStop(1,'#b71c1c');
  ctx.fillStyle=rb;glow('#ff1744',14);ctx.fillRect(cx-18,ry,36,56);noglow();
  ctx.fillStyle='rgba(255,50,50,.3)';ctx.beginPath();ctx.moveTo(cx+18,ry);ctx.lineTo(cx+22,ry-4);ctx.lineTo(cx+22,ry+52);ctx.lineTo(cx+18,ry+56);ctx.fill();
  ctx.fillStyle='#c62828';ctx.beginPath();ctx.moveTo(cx-18,ry);ctx.lineTo(cx+18,ry);ctx.lineTo(cx,ry-38);ctx.fill();
  ctx.beginPath();ctx.arc(cx,ry+18,8,0,Math.PI*2);ctx.fillStyle='#1565c0';glow('#40c4ff',8);ctx.fill();noglow();
  const funds=[{l:'Terminals',v:'$1.8M',c:'#00d4ff'},{l:'Regulatory',v:'$1.35M',c:'#00ff88'},{l:'Engineering',v:'$0.9M',c:'#a855f7'},{l:'Operations',v:'$0.45M',c:'#ffd700'}];
  funds.forEach((f,i)=>{
    const bx=w*.56+i*(w*.1+4),mh=h*.42,by=h*.5-mh*(parseFloat(f.v)/1.8)*Math.min(1,t*.52);
    const cur2=mh*(parseFloat(f.v)/1.8)*Math.min(1,t*.52);
    const g=ctx.createLinearGradient(bx,by,bx,by+cur2);g.addColorStop(0,f.c);g.addColorStop(1,f.c+'33');

function roundR(c,x,y,w2,h2,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w2-r,y);c.quadraticCurveTo(x+w2,y,x+w2,y+r);c.lineTo(x+w2,y+h2-r);c.quadraticCurveTo(x+w2,y+h2,x+w2-r,y+h2);c.lineTo(x+r,y+h2);c.quadraticCurveTo(x,y+h2,x,y+h2-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

// ===== RENDER LOOP =====
function loop(){resize();ctx.clearRect(0,0,W(),H());if(DRAWS[cur])DRAWS[cur]();t+=.016;animF=requestAnimationFrame(loop);}

// ===== TABLE =====
function buildTable(d){
  if(!d)return '';
  let s=`<table class="ltable"><thead><tr>`;
  d.h.forEach(hd=>s+=`<th>${hd}</th>`);s+='</tr></thead><tbody>';
  d.r.forEach(r=>{
    s+='<tr>';
    r.forEach((c,i)=>{
      let badge='';
      const lo=String(c).toLowerCase();
      if(i===d.h.length-1||i===2){
        if(/🟢|✅|live|active|verified|unlimited|capable|offline|pass|confirmed|sub 1|none needed|no cap|full/.test(lo))badge='bg';
        else if(/🟡|ussd|partial|device/.test(lo))badge='by';
        else if(/🔴|no|crisis|critical|failed|capped|online only|exploit/.test(lo))badge='br';
        else if(/🟣|patent|puf|ecc|mesh/.test(lo))badge='bp';
      }
      s+=badge?`<td><span class="badge ${badge}">${c}</span></td>`:`<td>${c}</td>`;
    });s+='</tr>';
  });return s+'</tbody></table>';
}

// ===== SLIDE LOGIC =====
function showSlide(n){
  const s=SLIDES[n];
  document.getElementById('hcnt').textContent=(n+1)+' / 20';
  document.getElementById('snum').textContent='SLIDE '+String(n+1).padStart(2,'0')+' / 20';
  document.getElementById('stitle').textContent=s.title;
  document.getElementById('stitle').style.color=s.accent;
  document.getElementById('sbody').textContent=s.body;
  document.getElementById('tbl').innerHTML=buildTable(s.tbl);
  document.getElementById('dot').style.background=s.accent;
  document.getElementById('pbtn').style.color=s.accent;
  document.getElementById('pbtn').style.borderColor=s.accent;
  document.getElementById('pbtn').textContent='▶ PLAY — OpenAI Shimmer';
  document.getElementById('pgfill').style.width=((n+1)/20*100)+'%';
  stopAudio();t=0;
}

let isPlaying=false;
function togglePlay(){
  const a=document.getElementById('aud');
  if(isPlaying){
    a.pause();
    isPlaying=false;
    document.getElementById('pbtn').textContent='▶ PLAY — OpenAI Shimmer';
    document.getElementById('fbplay').textContent='▶ PLAY';
  }else{
    if(!a.src||a.src===window.location.href){
      const n=String(cur+1).padStart(2,'0');
      a.src=ZP_AUDIO+'/slide_'+n+'.mp3';a.load();
    }
    a.play().then(()=>{isPlaying=true;document.getElementById('pbtn').textContent='⏸ PAUSE';document.getElementById('fbplay').textContent='⏸ PAUSE';}).catch(()=>{});
  }
}
function playA(){
  const a=document.getElementById('aud');
  const n=String(cur+1).padStart(2,'0');
  a.src=ZP_AUDIO+'/slide_'+n+'.mp3';a.load();
  a.play().then(()=>{isPlaying=true;document.getElementById('pbtn').textContent='⏸ PAUSE';document.getElementById('fbplay').textContent='⏸ PAUSE';}).catch(()=>{});
}
function stopAudio(){
  const a=document.getElementById('aud');
  a.pause();a.currentTime=0;a.src='';
  isPlaying=false;
  document.getElementById('pbtn').textContent='▶ PLAY — OpenAI Shimmer';
  document.getElementById('fbplay').textContent='▶ PLAY';
}
function onEnd(){
  isPlaying=false;
  document.getElementById('pbtn').textContent='▶ PLAY — OpenAI Shimmer';
  document.getElementById('fbplay').textContent='▶ PLAY';
  if(auto&&cur<19){setTimeout(()=>{nav(1);setTimeout(playA,600);},1200);}
  else if(auto&&cur===19){toggleAuto();}
}
function nav(d){const n=Math.max(0,Math.min(19,cur+d));if(n!==cur){const wasAuto=auto;stopAudio();cur=n;showSlide(cur);if(wasAuto)setTimeout(playA,400);}}
function toggleAuto(){
  auto=!auto;
  const b=document.getElementById('fbauto');
  b.textContent='AUTO: '+(auto?'ON ✓':'OFF');
  b.classList.toggle('on',auto);
  if(auto)setTimeout(playA,300);
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1);if(e.key===' '){e.preventDefault();playA();}});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>44)nav(dx<0?1:-1);},{passive:true});
window.addEventListener('load',()=>setTimeout(()=>{resize();showSlide(0);loop();},150));
</script>
