<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0d1b3e;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,#ffa500,#ff6f00);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 3px 16px rgba(255,120,0,.4)}
.brand-name{font-size:19px;font-weight:900;color:#fff;letter-spacing:1.5px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.brand-sub{font-size:9.5px;color:rgba(255,255,255,.85);margin-top:1px}
.brand-legal{font-size:7.5px;color:rgba(255,255,255,.65);margin-top:1px}
.slide-counter{font-size:14px;color:#fff;font-weight:900;text-align:right;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.ai-badge{font-size:8.5px;color:rgba(255,255,255,.8);text-align:right;margin-top:1px}
.prog-bar{height:5px;background:rgba(0,0,0,.2);flex-shrink:0}
.prog-fill{height:100%;background:linear-gradient(90deg,#fff,rgba(255,255,255,.6));transition:width .6s ease}
/* MAIN */
.slide-wrap{flex:1;position:relative;overflow:hidden}
.slide{display:none;flex-direction:column;justify-content:center;align-items:center;padding:30px 44px;text-align:center;position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.slide.active{display:flex;opacity:1}
/* ANIM CANVAS OVERLAY */
.cvs-wrap{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
canvas{width:100%;height:100%}
/* TEXT ON TOP */
.slide-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:820px}
.slide-icon{font-size:70px;margin-bottom:14px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.slide-num{font-size:10px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.6);margin-bottom:7px}
.slide-title{font-size:26px;font-weight:900;margin-bottom:14px;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.slide-text{font-size:13.5px;line-height:1.8;max-width:750px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.narr-pill{margin-top:16px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.3);border-radius:24px;padding:8px 18px;font-size:11px;color:#fff;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.narr-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);flex-shrink:0;transition:all .3s}
.narr-dot.on{animation:blink .5s ease-in-out infinite;background:#fff;box-shadow:0 0 8px #fff}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
/* THUMBS */
.thumb-strip{background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.1);display:flex;overflow-x:auto;padding:5px 8px;gap:5px;flex-shrink:0;scrollbar-width:thin;scrollbar-color:rgba(255,165,0,.5) transparent}
.thumb{border-radius:6px;border:2px solid rgba(255,255,255,.15);padding:5px 10px;font-size:8.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;color:rgba(255,255,255,.5)}
.thumb:hover{border-color:rgba(255,165,0,.5);color:#ffa500}
.thumb.active{border-color:#fff;color:#fff;background:rgba(255,255,255,.15)}
.thumb.done{border-color:rgba(255,200,0,.4);color:rgba(255,200,0,.6)}
/* CONTROLS */
.ctrl{background:rgba(0,0,0,.6);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.1);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.btn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font-size:11px;font-weight:700;padding:9px 14px;cursor:pointer;transition:all .2s;white-space:nowrap;touch-action:manipulation;backdrop-filter:blur(4px)}
.btn:hover{background:rgba(255,255,255,.25);border-color:#fff}
.btn:active{transform:scale(.95)}
.btn-play{background:linear-gradient(135deg,#ff6f00,#ffd54f);border:none;color:#000;font-size:13px;font-weight:900;padding:10px 26px;border-radius:10px;box-shadow:0 3px 14px rgba(255,150,0,.5);letter-spacing:.5px}
.btn-play:hover{background:linear-gradient(135deg,#ffa500,#ffe082);box-shadow:0 4px 20px rgba(255,180,0,.6)}
.dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .25s;touch-action:manipulation;border:1.5px solid rgba(255,255,255,.3)}
.dot.active{background:#fff;transform:scale(1.5);border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
.dot.done{background:rgba(255,200,0,.5);border-color:rgba(255,200,0,.5)}
.vbadge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 9px;font-size:8.5px;color:rgba(255,255,255,.8);text-align:center;line-height:1.5}
@media(max-width:640px){
  .slide{padding:18px 16px}
  .slide-icon{font-size:48px}
  .slide-title{font-size:18px}
  .slide-text{font-size:12px;line-height:1.7}
  .btn{padding:8px 11px;font-size:10px}
  .btn-play{padding:10px 18px;font-size:12px}
}
</style>

rm for African and emerging markets. 70 live projects. 11 countries. $5.1 billion pipeline. 29 percent average target return on investment. A 47-parameter AI scoring engine that no competitor can replicate. A fully operational platform seeking growth capital to scale to 500 projects and 25 countries. The institutional-grade investment marketplace that African real estate deserves. Join us."];

// ====== VIBRANT ANIMATION FUNCTIONS ======

function drawGlobe(t){
  const w=cvs.width,h=cvs.height,cx=w/2,cy=h/2,r=Math.min(w,h)*0.28;
  // Glowing rings
  for(let i=3;i>0;i--){ctx.beginPath();ctx.arc(cx,cy,r+i*18,0,Math.PI*2);ctx.strokeStyle=`rgba(0,212,255,${0.06*i})`;ctx.lineWidth=i*6;ctx.stroke();}
  // Globe
  const g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
  g.addColorStop(0,'#1e90ff');g.addColorStop(0.6,'#0066cc');g.addColorStop(1,'#003388');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  // Grid lines
  ctx.strokeStyle='rgba(150,220,255,0.2)';ctx.lineWidth=1;
  for(let la=-60;la<=60;la+=30){const ry=r*Math.sin(la*Math.PI/180),rx=r*Math.cos(la*Math.PI/180);ctx.beginPath();ctx.ellipse(cx,cy+ry,rx,rx*0.3,0,0,Math.PI*2);ctx.stroke();}
  for(let lo=0;lo<360;lo+=30){const a=(lo+t*25)*Math.PI/180;ctx.beginPath();ctx.arc(cx,cy,r,a,a+Math.PI);ctx.stroke();}
  // Africa — bright green
  ctx.fillStyle='#00e676';ctx.shadowColor='#00e676';ctx.shadowBlur=10;
  ctx.beginPath();ctx.ellipse(cx+r*0.1,cy-r*0.05,r*0.18,r*0.3,0.3,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Money dots orbiting
  for(let i=0;i<6;i++){
    const a=((t*80+i*60)*Math.PI/180),dx=cx+r*0.75*Math.cos(a),dy=cy+r*0.45*Math.sin(a);
    ctx.beginPath();ctx.arc(dx,dy,5,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,220,0,${0.6+0.4*Math.sin(t*4+i)})`;
    ctx.shadowColor='#ffd700';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
  }
  // Stats
  ctx.fillStyle='#fff';ctx.font='bold 12px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
  ctx.fillText('1.4 BILLION UNBANKED GLOBALLY',cx,h-36);
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='10px Segoe UI';
  ctx.fillText('$26B REMITTANCES · ZERO VERIFIED RE INVESTMENT',cx,h-18);ctx.shadowBlur=0;
}

function drawPerson(t){
  const w=cvs.width,h=cvs.height,cx=w/2,cy=h*0.42;
  // Colourful city skyline
  const bldColors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff'];
  for(let i=0;i<5;i++){
    const bw=w*0.1,bh=h*(0.22+i*0.06),bx=w*0.04+i*w*0.19;
    ctx.fillStyle=bldColors[i]+'44';ctx.fillRect(bx,h-bh-8,bw,bh);
    ctx.strokeStyle=bldColors[i]+'88';ctx.lineWidth=1.5;ctx.strokeRect(bx,h-bh-8,bw,bh);
    for(let j=0;j<Math.floor(bh/20);j++)for(let k=0;k<2;k++){
      const lit=Math.sin(t*1.5+j+k+i)>0;
      ctx.fillStyle=lit?bldColors[i]+'cc':'rgba(0,0,0,.3)';
      ctx.fillRect(bx+6+k*14,h-bh-8+10+j*16,9,9);
    }
  }
  // Person — bright
  ctx.fillStyle='#ffd54f';ctx.shadowColor='#ffd54f';ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(cx,cy-30,20,0,Math.PI*2);ctx.fill();
  ctx.fillRect(cx-18,cy-10,36,44);ctx.fillRect(cx-30,cy-6,14,32);ctx.fillRect(cx+16,cy-6,14,32);
  ctx.fillRect(cx-16,cy+32,13,28);ctx.fillRect(cx+3,cy+32,13,28);ctx.shadowBlur=0;
  // Question marks — vivid red
  for(let i=0;i<3;i++){
    const qx=cx+54+i*18,qy=cy-28+Math.sin(t*2+i)*8;
    ctx.fillStyle=`rgba(255,70,70,${0.8+0.2*Math.sin(t*3+i)})`;
    ctx.shadowColor='#ff4444';ctx.shadowBlur=6;
    ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.fillText('?',qx,qy);ctx.shadowBlur=0;
  }
  ctx.fillStyle='rgba(255,60,60,.85)';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
  ctx.fillText('NO VERIFIED DATA · £12,000 LOST',cx,h-18);ctx.shadowBlur=0;
}

function drawPlatform(t){
  const w=cvs.width,h=cvs.height,cx=w/2,cy=h/2;
  // Outer glow rings
  for(let i=3;i>0;i--){ctx.beginPath();ctx.arc(cx,cy,52+i*15,0,Math.PI*2);ctx.strokeStyle=`rgba(255,165,0,${0.04*i})`;ctx.lineWidth=i*8;ctx.stroke();}
  // Hub
  const hg=ctx.createRadialGradient(cx,cy,10,cx,cy,50);hg.addColorStop(0,'#ffd54f');hg.addColorStop(0.7,'#ffa500');hg.addColorStop(1,'#e65100');
  ctx.beginPath();ctx.arc(cx,cy,50,0,Math.PI*2);ctx.fillStyle=hg;ctx.shadowColor='#ffa500';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';ctx.fillText('BETONIQ',cx,cy-4);ctx.fillText('INVEST',cx,cy+9);
  // Colourful spokes
  const nodes=[
    {l:'AI SCORE',c:'#00e676'},{l:'COMPLIANCE',c:'#00b0ff'},{l:'INVESTORS',c:'#ff6d00'},
    {l:'DEVELOPERS',c:'#e040fb'},{l:'RETURNS',c:'#00e5ff'},{l:'MARKETS',c:'#ff1744'}
  ];
  nodes.forEach((n,i)=>{
    const a=((i/nodes.length)*Math.PI*2)+t*0.35,nx=cx+Math.cos(a)*105,ny=cy+Math.sin(a)*85;
    // Glow line
    ctx.strokeStyle=n.c;ctx.lineWidth=1.5;ctx.shadowColor=n.c;ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx,ny);ctx.stroke();ctx.shadowBlur=0;
    // Pulse dot
    const pf=(t*0.5+i/nodes.length)%1,px=cx+(nx-cx)*pf,py=cy+(ny-cy)*pf;
    ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fillStyle=n.c;ctx.shadowColor=n.c;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
    // Node circle
    ctx.beginPath();ctx.arc(nx,ny,18,0,Math.PI*2);ctx.fillStyle=n.c+'33';ctx.fill();
    ctx.strokeStyle=n.c;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=n.c;ctx.font='bold 7.5px Segoe UI';ctx.textAlign='center';ctx.fillText(n.l,nx,ny+3);
  });
  ctx.fillStyle='#fff';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
  ctx.fillText('$5.1B PIPELINE · 70 PROJECTS · 11 COUNTRIES',cx,h-16);ctx.shadowBlur=0;
}

function drawAI(t){
  const w=cvs.width,h=cvs.height,cx=w/2,cy=h/2;
  const layers=[[{x:cx-120,y:cy-55},{x:cx-120,y:cy},{x:cx-120,y:cy+55}],[{x:cx-45,y:cy-70},{x:cx-45,y:cy-25},{x:cx-45,y:cy+25},{x:cx-45,y:cy+70}],[{x:cx+30,y:cy-55},{x:cx+30,y:cy},{x:cx+30,y:cy+55}],[{x:cx+105,y:cy-28},{x:cx+105,y:cy+28}]];
  const lc=['#00e676','#00b0ff','#e040fb','#ffd740'];
  layers.forEach((layer,li)=>{
    if(li===layers.length-1)return;
    layer.forEach(n1=>layers[li+1].forEach(n2=>{
      const active=Math.sin(t*2.5+n1.x*0.05+n2.y*0.03)>0.2;
      ctx.strokeStyle=active?lc[li]:'rgba(255,255,255,.08)';ctx.lineWidth=active?1.8:0.8;
      if(active){ctx.shadowColor=lc[li];ctx.shadowBlur=4;}
      ctx.beginPath();ctx.moveTo(n1.x,n1.y);ctx.lineTo(n2.x,n2.y);ctx.stroke();ctx.shadowBlur=0;
    }));
  });
  layers.forEach((layer,li)=>layer.forEach((n,ni)=>{
    const pulse=0.6+0.4*Math.sin(t*2.5+li+ni);
    ctx.beginPath();ctx.arc(n.x,n.y,12*pulse,0,Math.PI*2);ctx.fillStyle=lc[li]+'33';ctx.fill();
    ctx.beginPath();ctx.arc(n.x,n.y,8,0,Math.PI*2);ctx.fillStyle=lc[li];ctx.shadowColor=lc[li];ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
  }));
  const score=Math.round(80+15*Math.abs(Math.sin(t*0.3)));
  ctx.fillStyle='#ffd740';ctx.font='bold 30px Segoe UI';ctx.textAlign='center';ctx.shadowColor='#ffd740';ctx.shadowBlur=12;
  ctx.fillText(score+'/100',cx+105,cy+72);ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='9px Segoe UI';ctx.fillText('AI SCORE',cx+105,cy+86);
  ctx.fillStyle='#00e676';ctx.font='bold 10px Segoe UI';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
  ctx.fillText('47 PARAMETERS · 5 CATEGORIES · ONE SCORE',cx,h-16);ctx.shadowBlur=0;
}

function drawBuilding(t){
  const w=cvs.width,h=cvs.height,cx=w/2;
  const bh=h*0.56,bw=w*0.38,bx=cx-bw/2,by=h-bh-20;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(bx+8,by+8,bw,bh);
  // Building gradient — vivid blue
  const bg=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  bg.addColorStop(0,'#42a5f5');bg.addColorStop(0.5,'#1565c0');bg.addColorStop(1,'#0d47a1');
  ctx.fillStyle=bg;ctx.fillRect(bx,by,bw,bh);
  // Windows — bright
  const winColors=['#ffd54f','#80cbc4','#ef9a9a','#a5d6a7','#90caf9'];
  for(let row=0;row<8;row++)for(let col=0;col<4;col++){
    const wx=bx+8+col*((bw-16)/4),wy=by+14+row*((bh-28)/8);
    const lit=Math.sin(t*1.5+row+col*2)>-0.2;

    ctx.fillStyle=lit?wc+'ee':'rgba(0,20,60,.6)';ctx.fillRect(wx,wy,(bw-16)/5,(bh-28)/9);
  }
  // Roof banner
  ctx.fillStyle='#ffa500';ctx.fillRect(bx+bw*0.2,by-16,bw*0.6,16);
  ctx.fillStyle='#000';ctx.font='bold 8px Segoe UI';ctx.textAlign='center';ctx.fillText('KATAMPE TERRACE, ABUJA',cx,by-3);
  // Score badge — glowing green
  ctx.fillStyle='#00e676';ctx.shadowColor='#00e676';ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(bx+bw+22,by+24,22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.font='bold 12px Segoe UI';ctx.textAlign='center';ctx.fillText('87',bx+bw+22,by+20);
  ctx.font='7.5px Segoe UI';ctx.fillText('/100',bx+bw+22,by+31);
  ctx.fillStyle='#1b5e20';ctx.fillRect(0,h-20,w,20);
  ctx.fillStyle='#69f0ae';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
  ctx.fillText('AI SCORE 87/100  ·  ROI 28%  ·  NPV $198,000  ·  IRR 31%',cx,h-6);ctx.shadowBlur=0;
}

function drawSteps(t){
  const w=cvs.width,h=cvs.height,cx=w/2;
  const steps=[['01','KYC','#00b0ff'],['02','COMMIT','#7c4dff'],['03','CONTRACT','#00e676'],['04','MILESTONES','#ff6d00'],['05','RETURNS','#ffd740']];
  const active=Math.floor((t*0.35)%steps.length);
  steps.forEach(([num,label,col],i)=>{
    const sy=h*0.1+i*(h*0.17),done=i<active,curr=i===active;
    if(i<steps.length-1){
      ctx.strokeStyle=done?col+'88':'rgba(255,255,255,.15)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
      ctx.beginPath();ctx.moveTo(cx-55,sy+22);ctx.lineTo(cx-55,sy+h*0.17-4);ctx.stroke();ctx.setLineDash([]);
    }
    // Node
    const r=curr?20:15;
    ctx.beginPath();ctx.arc(cx-55,sy,r,0,Math.PI*2);
    ctx.fillStyle=curr?col:done?col+'66':'rgba(255,255,255,.1)';
    if(curr){ctx.shadowColor=col;ctx.shadowBlur=16;}ctx.fill();ctx.shadowBlur=0;
    if(curr){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx-55,sy,r+5,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle=curr?'#000':'rgba(255,255,255,.7)';ctx.font=`bold ${curr?11:9}px Segoe UI`;ctx.textAlign='center';ctx.fillText(num,cx-55,sy+4);
    ctx.fillStyle=curr?col:'rgba(255,255,255,'+( done?'.7':'.35' )+')';
    ctx.font=`${curr?'bold ':''}${curr?11:10}px Segoe UI`;ctx.textAlign='left';ctx.fillText(label,cx-28,sy+4);
    if(done){ctx.fillStyle='#00e676';ctx.shadowColor='#00e676';ctx.shadowBlur=6;ctx.font='bold 15px Arial';ctx.textAlign='right';ctx.fillText('✓',w-18,sy+5);ctx.shadowBlur=0;}
  });
  ctx.fillStyle='#ffd740';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
  ctx.fillText('£4,200 RETURN ON £15,000  =  28% EXACTLY AS PROJECTED',cx,h-16);ctx.shadowBlur=0;
}

    const nx=cx+(n.x-.5)*w*.85,ny=cy+(n.y-.5)*h*.85;
    ctx.strokeStyle=n.c+'55';ctx.lineWidth=1.5;ctx.shadowColor=n.c;ctx.shadowBlur=4;
    ctx.beginPath();ctx.moveTo(nx,ny);ctx.lineTo(cx,cy);ctx.stroke();ctx.shadowBlur=0;
    const pf=(t*.5+i/nodes.length)%1,px=nx+(cx-nx)*pf,py=ny+(cy-ny)*pf;
    ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fillStyle=n.c;ctx.shadowColor=n.c;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
    const pulse=.88+.12*Math.sin(t*2+i);
    ctx.beginPath();ctx.arc(nx,ny,22*pulse,0,Math.PI*2);ctx.fillStyle=n.c+'22';ctx.fill();
    ctx.beginPath();ctx.arc(nx,ny,15,0,Math.PI*2);ctx.fillStyle=n.c;ctx.shadowColor=n.c;ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#000';ctx.font='bold 6.5px Segoe UI';ctx.textAlign='center';
    n.l.split('\n').forEach((ln,j)=>ctx.fillText(ln,nx,-3+ny+j*9));
  });
  const hpulse=.9+.1*Math.sin(t*3);
  ctx.beginPath();ctx.arc(cx,cy,34*hpulse,0,Math.PI*2);
  const hg=ctx.createRadialGradient(cx,cy,8,cx,cy,34);hg.addColorStop(0,'#ffd54f');hg.addColorStop(1,'#ff6f00');
  ctx.fillStyle=hg;ctx.shadowColor='#ffa500';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.font='bold 8px Segoe UI';ctx.textAlign='center';ctx.fillText('LIVE',cx,cy-4);ctx.fillText('PLATFORM',cx,cy+7);
  ctx.fillStyle='#00e676';ctx.shadowColor='#00e676';ctx.shadowBlur=8;ctx.font='bold 10px Segoe UI';ctx.textAlign='center';
  ctx.fillText('● ALL SYSTEMS OPERATIONAL',cx,h-16);ctx.shadowBlur=0;
}

function drawGates(t){
  const w=cvs.width,h=cvs.height,cx=w/2;
  const pass1=Math.sin(t*.5)>-.6,pass2=pass1&&Math.sin(t*.3+1)>-.5;
  [[cx-55,pass1,0],[cx+55,pass2,1]].forEach(([gx,pass,gi])=>{
    const c=pass?'#00e676':'#ff1744';
    ctx.fillStyle=pass?'rgba(0,230,118,.12)':'rgba(255,23,68,.12)';ctx.fillRect(gx-40,h*.17,80,h*.66);
    ctx.strokeStyle=c;ctx.lineWidth=2;ctx.shadowColor=c;ctx.shadowBlur=8;ctx.strokeRect(gx-40,h*.17,80,h*.66);ctx.shadowBlur=0;
    ctx.fillStyle=c;ctx.font='bold 9px Segoe UI';ctx.textAlign='center';
    ctx.fillText('GATE '+(gi+1),gx,h*.24);ctx.fillText(gi===0?'AI SCORE':'COMPLIANCE',gx,h*.31);
    ctx.font=`bold 22px Segoe UI`;ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=8;
    ctx.fillText(pass?(gi===0?'87':'92'):(gi===0?'62':'71'),gx,h*.46);ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='8px Segoe UI';ctx.fillText('MIN '+(gi===0?'75':'80')+'/100',gx,h*.54);
    ctx.fillStyle=c;ctx.font='bold 10px Segoe UI';ctx.shadowColor=c;ctx.shadowBlur=6;
    ctx.fillText(pass?'✓ PASS':'✗ REJECT',gx,h*.63);ctx.shadowBlur=0;
  });
  ctx.fillStyle='#ffd740';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
  ctx.fillText('BOTH GATES MUST PASS · COMPLIANCE SCORE ≥ 80/100',cx,h-16);ctx.shadowBlur=0;
}

function drawRocket(t){
  const w=cvs.width,h=cvs.height,cx=w/2;
  // Stars
  for(let i=0;i<35;i++){const sx=(i*137+t*6)%w,sy=(i*83+t*2)%h;ctx.beginPath();ctx.arc(sx,sy,1.2,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${.3+.7*Math.sin(t+i)})`;ctx.fill();}
  const ry=h*.5-Math.sin(t)*9;
  // Flame — vivid
  for(let i=0;i<3;i++){const fw=12+i*6,fy=ry+50+Math.random()*14;const fc=['#ffa500','#ff6f00','#ffd740'][i];ctx.fillStyle=fc;ctx.shadowColor=fc;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(cx-fw/2,ry+46);ctx.lineTo(cx+fw/2,ry+46);ctx.lineTo(cx,fy);ctx.fill();ctx.shadowBlur=0;}
  // Body
  const bg=ctx.createLinearGradient(cx-20,ry,cx+20,ry+46);bg.addColorStop(0,'#ef5350');bg.addColorStop(1,'#b71c1c');
  ctx.fillStyle=bg;ctx.shadowColor='#ff1744';ctx.shadowBlur=10;ctx.fillRect(cx-20,ry,40,46);ctx.shadowBlur=0;
  // Nose
  ctx.beginPath();ctx.moveTo(cx-20,ry);ctx.lineTo(cx+20,ry);ctx.lineTo(cx,ry-34);ctx.fill();
  // Window
  ctx.beginPath();ctx.arc(cx,ry+18,11,0,Math.PI*2);ctx.fillStyle='#1565c0';ctx.shadowColor='#40c4ff';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#80d8ff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#80d8ff';ctx.font='7px Arial';ctx.textAlign='center';ctx.fillText('B',cx,ry+21);
  // Fins
  ctx.fillStyle='#c62828';ctx.beginPath();ctx.moveTo(cx-20,ry+30);ctx.lineTo(cx-36,ry+46);ctx.lineTo(cx-20,ry+46);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+20,ry+30);ctx.lineTo(cx+36,ry+46);ctx.lineTo(cx+20,ry+46);ctx.fill();
  ctx.fillStyle='#ffd740';ctx.font='bold 11.5px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=6;
  ctx.fillText('$4.5M PRE-SERIES A',cx,h*.87);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='9px Segoe UI';
  ctx.fillText('$25M PRE-MONEY · 18% EQUITY · 3x AT SERIES A',cx,h*.94);ctx.shadowBlur=0;
}

function drawStar(t){
  const w=cvs.width,h=cvs.height,cx=w/2,cy=h/2;
  for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2+t*.2,r=Math.min(w,h)*.44;ctx.strokeStyle=`rgba(255,215,0,${.1+.08*Math.sin(t+i)})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();}
  function drawStar5(x,y,r1,r2,rot){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2===0?r1:r2,a=(i/5)*Math.PI+rot;i===0?ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
  const pulse=.9+.1*Math.sin(t*2);
  drawStar5(cx,cy,68*pulse,34*pulse,-Math.PI/2+t*.08);
  const sg=ctx.createRadialGradient(cx,cy,10,cx,cy,68);sg.addColorStop(0,'#fff176');sg.addColorStop(.4,'#ffd740');sg.addColorStop(.8,'#ffa500');sg.addColorStop(1,'#ff6f00');
  ctx.fillStyle=sg;ctx.shadowColor='#ffd740';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';ctx.fillText('JOIN US',cx,cy+4);
  const stats=['70 PROJECTS','$5.1B PIPELINE','29% ROI','47-PARAM AI','11 COUNTRIES'];
  stats.forEach((s,i)=>{
    const a=(i/stats.length)*Math.PI*2+t*.1,sr=h*.34,sx=cx+Math.cos(a)*sr,sy=cy+Math.sin(a)*sr;
    const statColors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff'];
    ctx.fillStyle=statColors[i];ctx.shadowColor=statColors[i];ctx.shadowBlur=6;
    ctx.font='bold 8px Segoe UI';ctx.textAlign='center';ctx.fillText(s,sx,sy);ctx.shadowBlur=0;
  });
  ctx.fillStyle='#ffd740';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=6;
  ctx.fillText('BLOOMBERG OF AFRICAN REAL ESTATE',cx,h-16);ctx.shadowBlur=0;
}

const ANIM_FNS={globe:drawGlobe,person:drawPerson,platform:drawPlatform,ai:drawAI,building:drawBuilding,steps:drawSteps,developer:drawDeveloper,investors:drawInvestors,map:drawMap,revenue:drawRevenue,growth:drawGrowth,live:drawLive,gates:drawGates,rocket:drawRocket,star:drawStar};
function runAnim(){animT+=.016;ctx.clearRect(0,0,cvs.width,cvs.height);if(ANIM_FNS[ANIMS[cur]])ANIM_FNS[ANIMS[cur]](animT);animFrame=requestAnimationFrame(runAnim);}

// Status
function setStatus(state,text){
  const dot=document.getElementById('nd'+cur);const txt=document.getElementById('nt'+cur);
  if(!dot||!txt)return;
  dot.className='narr-dot'+(state==='speaking'?' on':'');
  if(state==='done')dot.style.background='#69f0ae';
  else if(state!=='speaking')dot.style.removeProperty('background');
  txt.textContent=text;
}

function onEnd(idx){playing=false;setStatus('done','✅ Narration complete — OpenAI Shimmer voice');document.getElementById('playBtn').textContent='▶ PLAY NARRATION';if(autoAdvance&&idx<TOTAL-1){setTimeout(()=>{jumpTo(idx+1);playSlide(idx+1);},900);}else if(autoAdvance&&idx===TOTAL-1){autoAdvance=false;document.getElementById('autoBtn').textContent='AUTO: OFF';document.getElementById('autoBtn').style.background='';}}
function onErr(idx){playing=false;setStatus('error','⚠ Tap ▶ PLAY again');document.getElementById('playBtn').textContent='▶ PLAY NARRATION';}
function stopAll(){audEls.forEach(a=>{try{a.pause();a.currentTime=0;}catch(e){}});playing=false;}
function playSlide(idx){stopAll();const a=audEls[idx];if(!a)return;a.preload='auto';playing=true;document.getElementById('playBtn').textContent='⏸ PAUSE';setStatus('speaking','🎙️ OpenAI Shimmer · professional female narration playing...');if(audEls[idx+1])audEls[idx+1].preload='auto';a.play().catch(()=>{playing=false;setStatus('error','⚠ Tap ▶ PLAY NARRATION (browser audio policy)');document.getElementById('playBtn').textContent='▶ PLAY NARRATION';});}
function togglePlay(){if(playing){stopAll();document.getElementById('playBtn').textContent='▶ PLAY NARRATION';setStatus('idle','Paused — press ▶ PLAY to resume');return;}playSlide(cur);}
function toggleAuto(){autoAdvance=!autoAdvance;const btn=document.getElementById('autoBtn');btn.textContent='AUTO: '+(autoAdvance?'ON':'OFF');btn.style.background=autoAdvance?'rgba(255,165,0,.3)':'';if(autoAdvance&&!playing)playSlide(cur);}

function updateUI(){
  document.getElementById('sCurr').textContent=cur+1;
  document.getElementById('prog').style.width=(((cur+1)/TOTAL)*100)+'%';
  SLIDE_DIVS.forEach((s,i)=>{s.className='slide'+(i===cur?' active':'');s.style.background=BKGS[i];});
  TITLES.forEach((_,i)=>{
    const th=document.getElementById('th'+i),dt=document.getElementById('dt'+i);
    if(th)th.className='thumb'+(i===cur?' active':i<cur?' done':'');
    if(dt)dt.className='dot'+(i===cur?' active':i<cur?' done':'');
  });
  document.getElementById('th'+cur)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  setStatus('idle','Press ▶ PLAY NARRATION for OpenAI Shimmer professional audio');
  document.getElementById('playBtn').textContent='▶ PLAY NARRATION';
}

function go(dir){const next=Math.max(0,Math.min(TOTAL-1,cur+dir));if(next===cur)return;const was=playing||autoAdvance;jumpTo(next);if(was)playSlide(next);}
function jumpTo(idx){stopAll();cur=idx;animT=0;updateUI();}

updateUI();runAnim();

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key.toLowerCase()==='p')togglePlay();
  else if(e.key.toLowerCase()==='a')toggleAuto();
});
let tx=0;
document.getElementById('slideWrap').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.getElementById('slideWrap').addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientX-tx)>60)go(e.changedTouches[0].clientX<tx?1:-1);},{passive:true});
</script>
