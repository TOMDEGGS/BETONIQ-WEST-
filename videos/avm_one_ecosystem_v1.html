    const sig=el('circle',{r:10,fill:'#E0A100',stroke:'#fff','stroke-width':3},g);
    const fb=el('path',{d:'M820,350 Q570,520 340,430',fill:'none',stroke:'#1E9E5A','stroke-width':4,'stroke-dasharray':'8 8',opacity:0},g);
    const ft=el('text',{x:580,y:500,'text-anchor':'middle','font-size':20,'font-family':'Arial','font-weight':700,fill:'#1E9E5A',opacity:0},g);ft.textContent='Feedback keeps trust alive';
    const pts=[[330,420],[520,420],[650,370],[820,340]];
    anim=(p,tt)=>{const u=Math.min(1,tt/6)*3,i=Math.min(2,Math.floor(u)),f=u-i;sig.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);sig.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);const on=tt>6.5?1:0;fb.setAttribute('opacity',on);ft.setAttribute('opacity',on)};
    setHint('Tap a stage');
  }
  if(kind==='window'){
    const cx=500,cy=300,r=140;el('circle',{cx,cy,r,fill:'#fff',stroke:'#12263F','stroke-width':8},g);
    for(let i=0;i<12;i++){const a=i*Math.PI/6;el('line',{x1:cx+Math.cos(a)*(r-14),y1:cy+Math.sin(a)*(r-14),x2:cx+Math.cos(a)*(r-4),y2:cy+Math.sin(a)*(r-4),stroke:'#12263F','stroke-width':4},g)}
    const arc=el('path',{d:'',fill:'#E0A10088',stroke:'#E0A100','stroke-width':3},g);
    const hand=el('line',{x1:cx,y1:cy,x2:cx,y2:cy-r+20,stroke:'#C0392B','stroke-width':6,'stroke-linecap':'round'},g);
    const lab=el('text',{x:cx,y:cy+r+60,'text-anchor':'middle','font-size':30,'font-family':'Arial','font-weight':800,fill:'#12263F'},g);
    const side=['Rapid response units','Medical evacuation','Communications','Community liaison'].map((l,i)=>{const gg=el('g',{opacity:0},g);el('rect',{x:720,y:150+i*70,width:240,height:50,rx:10,fill:'#1E6FD9'},gg);const tx=el('text',{x:840,y:182+i*70,'text-anchor':'middle','font-size':17,'font-family':'Arial','font-weight':700,fill:'#fff'},gg);tx.textContent=l;return gg});
    anim=(p,tt)=>{const m=Math.min(60,tt/8*60),ang=-Math.PI/2+m/60*2*Math.PI;hand.setAttribute('x2',cx+Math.cos(ang)*(r-20));hand.setAttribute('y2',cy+Math.sin(ang)*(r-20));
      const x2=cx+Math.cos(ang)*(r-6),y2=cy+Math.sin(ang)*(r-6);arc.setAttribute('d',`M${cx},${cy} L${cx},${cy-r+6} A${r-6},${r-6} 0 ${m>30?1:0} 1 ${x2},${y2} Z`);lab.textContent=Math.round(m)+' minutes';
      side.forEach((s,i)=>s.setAttribute('opacity',tt>1+i*1.2?1:0))};
  }
  if(kind==='close'){
    const gl=el('g',{},g);
    const stars=[];for(let i=0;i<14;i++){const c=el('circle',{cx:80+i*62,cy:120+((i*47)%220),r:5,fill:'#E0A100'},gl);stars.push(c)}
    const grp=[['f','#E0A100',250],['m','#1E6FD9',380],['f','#1E9E5A',500],['m','#12263F',620],['f','#C0392B',750]].map(d=>{const gg=el('g',{opacity:0},g);person(gg,d[2],300,d[1],1.25,d[0]);return gg});
    const big=el('text',{x:500,y:490,'text-anchor':'middle','font-size':44,'font-family':'Georgia','font-weight':700,fill:'#12263F',opacity:0},g);big.textContent='Prevent first, react second.';
    anim=(p,tt)=>{stars.forEach((s,i)=>{s.setAttribute('r',4+Math.abs(Math.sin(tt*2+i))*5);});grp.forEach((gg,i)=>{const k=Math.max(0,Math.min(1,(tt-i*.5)/.6));gg.setAttribute('opacity',k)});big.setAttribute('opacity',Math.min(1,Math.max(0,(tt-3)/1)))};
  }
}
function setHint(txt){const h=$('hint');if(txt){h.textContent=txt;h.style.display='block'}else h.style.display='none'}
function showPanel(a,b){$('pt').textContent=a;$('pb').textContent=b;$('panel').style.display='block'}
$('px').onclick=()=>$('panel').style.display='none';

/* ---------- 3D (Three.js) : globe + glowing network on selected scenes ---------- */
function webglOK(){try{const c=document.createElement('canvas');return !!(window.THREE&&(c.getContext('webgl')||c.getContext('experimental-webgl')))}catch(e){return false}}
let globe,netGroup,ring,people3D=[],floor;
function init3D(){
  R=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true});R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setClearColor(0x000000,0);
  scene3=new THREE.Scene();cam=new THREE.PerspectiveCamera(45,16/9,.1,100);cam.position.set(0,0,12);
  scene3.add(new THREE.AmbientLight(0xffffff,.85));const L=new THREE.DirectionalLight(0xffffff,.9);L.position.set(5,8,8);scene3.add(L);
  globe=new THREE.Group();scene3.add(globe);
  const sph=new THREE.Mesh(new THREE.SphereGeometry(2.6,40,28),new THREE.MeshStandardMaterial({color:0x1E6FD9,roughness:.6,metalness:.1,transparent:true,opacity:.92}));globe.add(sph);
  const wire=new THREE.Mesh(new THREE.SphereGeometry(2.64,22,16),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.35}));globe.add(wire);
  // glowing markers (the corridor region)
  for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),new THREE.MeshBasicMaterial({color:0xE0A100}));const lat=(.08+Math.random()*.25),lon=(.2+i*.12);const r=2.72;m.position.set(r*Math.cos(lat)*Math.sin(lon*3),r*Math.sin(lat+.35),r*Math.cos(lat)*Math.cos(lon*3));globe.add(m);m.userData.i=i}
  ring=new THREE.Mesh(new THREE.TorusGeometry(3.4,.04,10,90),new THREE.MeshBasicMaterial({color:0xE0A100}));ring.rotation.x=1.2;scene3.add(ring);
  // network of 8 spheres
  netGroup=new THREE.Group();scene3.add(netGroup);
  const hub=new THREE.Mesh(new THREE.SphereGeometry(.7,24,24),new THREE.MeshStandardMaterial({color:0xE0A100}));netGroup.add(hub);
  for(let i=0;i<8;i++){const a=i*Math.PI/4;const p=new THREE.Vector3(Math.cos(a)*3.4,Math.sin(a)*2.2,(i%2?1:-1)*1.2);const n=new THREE.Mesh(new THREE.SphereGeometry(.42,20,20),new THREE.MeshStandardMaterial({color:0x1E6FD9}));n.position.copy(p);netGroup.add(n);
    const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),p]);netGroup.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0x1E6FD9})));
    const pk=new THREE.Mesh(new THREE.SphereGeometry(.12,10,10),new THREE.MeshBasicMaterial({color:0xE0A100}));pk.userData={p,i};netGroup.add(pk);people3D.push(pk)}
  // five 3D columns (SEE SHARE DECIDE ACT LEARN)
  floor=new THREE.Group();scene3.add(floor);
  for(let i=0;i<5;i++){const h=1+i*.55;const m=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,h,28),new THREE.MeshStandardMaterial({color:i%2?0xE0A100:0x1E6FD9}));m.position.set((i-2)*1.7,-1.6+h/2,0);m.userData.h=h;floor.add(m)}
  resize();
}
function resize(){if(!R)return;const w=$('stage').clientWidth,h=$('stage').clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
function draw3D(i,tt){
  const kind=SCENES[i].v;
  const showGlobe=(kind==='force'||kind==='question'||kind==='close'||kind==='window');
  const showNet=(kind==='network'||kind==='sensor');
  const showCols=(kind==='five');
  globe.visible=showGlobe;ring.visible=showGlobe;netGroup.visible=showNet;floor.visible=showCols;
  const sc=Math.min(1,tt/1.2);
  if(showGlobe){globe.rotation.y=t*.5+(dragY||0);globe.rotation.x=.25+(dragX||0);globe.scale.setScalar(.55+sc*.25);globe.position.set(kind==='close'?0:3.8,kind==='close'?1.0:.4,0);ring.position.copy(globe.position);ring.rotation.z=t*.6;ring.scale.setScalar(.55+sc*.25);
    globe.children.forEach(c=>{if(c.userData.i!=null)c.scale.setScalar(1+.5*Math.sin(t*4+c.userData.i))})}
  if(showNet){netGroup.rotation.y=Math.sin(t*.4)*.5+(dragY||0);netGroup.rotation.x=.15+(dragX||0);netGroup.scale.setScalar((.4+sc*.15));netGroup.position.set(kind==='sensor'?3.6:0,kind==='sensor'?1:0,0);
    people3D.forEach(pk=>{const u=((t*.6+pk.userData.i*.12)%1);pk.position.copy(pk.userData.p).multiplyScalar(u)})}
  if(showCols){floor.rotation.y=Math.sin(t*.5)*.4+(dragY||0);floor.position.y=1.2;floor.scale.setScalar(.6);floor.children.forEach((m,k)=>{const g=Math.max(0,Math.min(1,(tt-k*1.6)/.8));m.scale.y=Math.max(.01,g);m.position.y=-1.6+m.userData.h*g/2})}
  // camera push-in per scene
  const push=12-Math.min(3,tt*.35);cam.position.z=push;cam.position.x=Math.sin(t*.3)*.6;cam.lookAt(0,0,0);
  R.render(scene3,cam);
}
let dragging=false,dragX=0,dragY=0,lx=0,ly=0;
const stg=document.getElementById('stage');
stg.addEventListener('pointerdown',e=>{if(e.target.closest('.node,button,#panel,#quiz'))return;dragging=true;lx=e.clientX;ly=e.clientY});
window.addEventListener('pointermove',e=>{if(!dragging)return;dragY+=(e.clientX-lx)*.01;dragX+=(e.clientY-ly)*.005;lx=e.clientX;ly=e.clientY});
window.addEventListener('pointerup',()=>dragging=false);
function set2D(on){use3D=!on&&hasGL;$('gl').style.display=use3D?'block':'none';$('mode').textContent=use3D?'Switch to 2D':'Switch to 3D'}

/* ---------- Voice (optional, never drives the clock) ---------- */
function speak(txt){if(!voiceOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=.95;const v=speechSynthesis.getVoices();const pick=v.find(x=>/Google UK English Female/i.test(x.name))||v.find(x=>/Hazel|Serena|Kate/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||null;if(pick)u.voice=pick;speechSynthesis.speak(u)}

/* ---------- Master clock ---------- */
function idx(){for(let i=SCENES.length-1;i>=0;i--)if(t>=starts[i])return i;return 0}
function enter(i){
  cur=i;$('count').textContent='Scene '+(i+1)+' of '+SCENES.length;
  $('ttl').innerHTML='<span>'+SCENES[i].t+'</span>';$('sub').textContent=SCENES[i].s;
  $('cap').textContent=ccOn?SCENES[i].c:'';$('panel').style.display='none';setHint(null);
  art(SCENES[i].v);
  if(SCENES[i].info&&SCENES[i].v!=='five'&&SCENES[i].v!=='network'&&SCENES[i].v!=='sensor'){setHint('Tap the box for a detail');}
  [...$('menu').children].forEach((b,k)=>b.classList.toggle('cur',k===i));
  speak(SCENES[i].c);
  dragX=0;dragY=0;
}
function frame(n){
  if(playing&&!quizOpen){t+=(n-last)/1000;
    if(!quizDone&&t>=starts[QUIZ.after]){t=starts[QUIZ.after];openQuiz()}
    if(t>=T){t=T-.001;playing=false;$('play').textContent='Play';speechSynthesis&&speechSynthesis.cancel()}}
  last=n;
  if(!document.hidden){const i=idx();if(i!==cur)enter(i);const tt=t-starts[i];if(anim)anim(t,tt);if(use3D&&R)draw3D(i,tt)}
  $('fill').style.width=(t/T*100)+'%';requestAnimationFrame(frame)
}
function jump(i){i=Math.max(0,Math.min(SCENES.length-1,i));t=starts[i]+.01;quizOpen=false;$('quiz').style.display='none';enter(i);if(!playing&&t<T){}}
/* ---------- Quiz ---------- */
function openQuiz(){quizOpen=true;$('quiz').style.display='flex';$('qq').textContent=QUIZ.q;$('qr').textContent='';$('qc').style.display='none';const o=$('qo');o.innerHTML='';
  QUIZ.o.forEach(a=>{const b=document.createElement('button');b.textContent=a[0];b.onclick=()=>{$('qr').style.color=a[1]?'#1E9E5A':'#C0392B';$('qr').textContent=a[1]?QUIZ.why:'Not quite. Try again.';if(a[1])$('qc').style.display='inline-block'};o.appendChild(b)})}
$('qc').onclick=()=>{quizDone=true;quizOpen=false;$('quiz').style.display='none'};
/* ---------- Controls ---------- */
$('go').onclick=()=>{$('start').style.display='none';playing=true;last=performance.now();enter(idx());window.speechSynthesis&&speechSynthesis.getVoices()};
$('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';if(!playing)window.speechSynthesis&&speechSynthesis.cancel();else speak(SCENES[cur].c)};
$('next').onclick=()=>{if(quizOpen){return}jump(idx()+1)};$('back').onclick=()=>jump(idx()-1);
$('rst').onclick=()=>{t=0;quizDone=false;quizOpen=false;$('quiz').style.display='none';playing=true;$('play').textContent='Pause';cur=-1;last=performance.now()};
$('cc').onclick=e=>{ccOn=!ccOn;e.target.textContent='Captions: '+(ccOn?'On':'Off');$('cap').textContent=ccOn?SCENES[cur].c:''};
$('voice').onclick=e=>{voiceOn=!voiceOn;e.target.textContent='Voice: '+(voiceOn?'On':'Off');if(voiceOn)speak(SCENES[cur].c);else window.speechSynthesis&&speechSynthesis.cancel()};
$('mode').onclick=()=>{if(!hasGL)return;set2D(use3D)};
$('rm').onclick=e=>{rmOn=!rmOn;document.body.classList.toggle('reduce',rmOn);e.target.textContent=rmOn?'Motion: Reduced':'Reduce motion'};
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();const nt=((e.clientX-r.left)/r.width)*T;if(!quizDone&&nt>=starts[QUIZ.after])quizDone=true;t=Math.max(0,Math.min(T-.01,nt));quizOpen=false;$('quiz').style.display='none'};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowRight')$('next').click();if(e.code==='ArrowLeft')$('back').click()});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=performance.now()});
// info boxes: tap the sub-title to open the scene detail
$('sub').style.pointerEvents='auto';$('sub').style.cursor='pointer';$('sub').onclick=()=>{const s=SCENES[cur];if(s&&s.info)showPanel(s.info[0],s.info[1])};
$('hint').style.pointerEvents='auto';$('hint').style.cursor='pointer';$('hint').onclick=()=>{const s=SCENES[cur];if(s&&s.info)showPanel(s.info[0],s.info[1])};
// chapter menu
SCENES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+s.t;b.onclick=()=>{if(!quizDone&&i>QUIZ.after)quizDone=true;jump(i)};$('menu').appendChild(b)});
// start-up: WebGL check with automatic 2D fallback
hasGL=webglOK();
if(hasGL){try{init3D();set2D(false)}catch(e){hasGL=false;set2D(true);$('mode').style.display='none'}}else{set2D(true);$('mode').style.display='none'}
enter(0);requestAnimationFrame(frame);
</script></body></html>
