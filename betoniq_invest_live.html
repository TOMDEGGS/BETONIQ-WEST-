<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#050818;color:#fff;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column}
.hdr{padding:8px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:2px solid;transition:border-color .5s}
.brand-name{font-size:17px;font-weight:900;letter-spacing:1px;transition:color .5s}

/* LAYOUT: left panel (animation) + right panel (text) */
.main-wrap{flex:1;display:flex;overflow:hidden;min-height:0}
.anim-col{width:55%;flex-shrink:0;position:relative;overflow:hidden;border-right:1px solid rgba(255,255,255,.05)}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}

.narr-pill{margin-top:14px;border:1.5px solid;border-radius:24px;padding:7px 16px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer;transition:all .3s;letter-spacing:.3px;background:rgba(0,0,0,.3)}
.narr-pill:hover{transform:scale(1.03)}
.ndot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
.ndot.on{animation:ndot-pulse .5s ease-in-out infinite}
@keyframes ndot-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.4);opacity:.3}}
.thumb-strip{background:rgba(0,0,0,.7);border-top:1px solid rgba(255,255,255,.06);display:flex;overflow-x:auto;padding:4px 8px;gap:4px;flex-shrink:0;scrollbar-width:thin}
.thumb{border-radius:5px;border:1.5px solid rgba(255,255,255,.1);padding:4px 9px;font-size:8px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;color:rgba(255,255,255,.35)}
.thumb:hover{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.25)}
.thumb.active{border-color:currentColor;background:rgba(255,255,255,.06)}
.ctrl{background:rgba(0,0,0,.85);border-top:1px solid rgba(255,255,255,.05);padding:8px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.btn{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:7px;color:#fff;font-size:10.5px;font-weight:700;padding:8px 13px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.95)}
.btn-play{font-size:12px;font-weight:900;padding:9px 22px;border-radius:9px;border:none;color:#000;transition:background .5s,box-shadow .3s}
.dots{flex:1;display:flex;justify-content:center;gap:4px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .25s;border:1px solid rgba(255,255,255,.1)}
.dot.active{transform:scale(1.6)}
.dot.done{opacity:.45}
.vbadge{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:3px 8px;font-size:8px;color:rgba(255,255,255,.5);text-align:center;line-height:1.5}
@media(max-width:768px){
  .main-wrap{flex-direction:column}
  .anim-col{width:100%;height:220px}
  .text-col{padding:14px 16px}
  .slide-title{font-size:16px}
  .slide-text{font-size:11.5px}

g growth capital to scale to 500 projects and 25 countries. Join us."];

// ==================== LIVE ANIMATION LIBRARY ====================
// Each animation tells a data story with real moving elements

function anim_globe(t){
  const W=cvs.width,H=cvs.height,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=BKGS[0];ctx.fillRect(0,0,W,H);
  
  // LIVE COUNTER — 1.4 billion ticking up
  const unbanked=1400000000+Math.floor(t*1000);
  ctx.fillStyle='rgba(0,212,255,0.06)';ctx.font=`bold ${Math.min(W*.22,90)}px Segoe UI`;ctx.textAlign='center';
  ctx.fillText('1.4B',cx,cy*.6);
  
  // Spinning globe made of latitude/longitude lines
  const R=Math.min(W,H)*.28;
  const glow=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R);
  glow.addColorStop(0,'#1e4080');glow.addColorStop(.7,'#0a2050');glow.addColorStop(1,'#030f28');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
  
  // Latitude rings
  ctx.strokeStyle='rgba(0,200,255,0.18)';ctx.lineWidth=1;
  for(let lat=-75;lat<=75;lat+=15){
    const ry=R*Math.sin(lat*Math.PI/180),rx=R*Math.cos(lat*Math.PI/180);
    ctx.beginPath();ctx.ellipse(cx,cy+ry,rx,rx*.3,0,0,Math.PI*2);ctx.stroke();
  }
  // Longitude arcs rotating
  for(let lon=0;lon<180;lon+=20){
    const a=(lon+t*18)*Math.PI/180;
    ctx.beginPath();ctx.arc(cx,cy,R,a,a+Math.PI);ctx.stroke();
  }
  
  // Africa — bright glowing green
  ctx.shadowColor='#00e676';ctx.shadowBlur=20;
  ctx.fillStyle='#00e676';
  ctx.beginPath();ctx.ellipse(cx+R*.12,cy-R*.04,R*.2,R*.32,0.25,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  
  // LIVE money packets flying from diaspora to Africa
  const routes=[[.15,.25],[.2,.15],[.18,.32],[.82,.2],[.78,.35]];
  routes.forEach((r,i)=>{
    const sx=r[0]*W,sy=r[1]*H;
    const prog=(t*.4+i*.2)%1;
    const px=sx+(cx-sx)*prog,py=sy+(cy-py*.1+sy*.1)*prog;
    // trail
    ctx.strokeStyle=`rgba(255,200,0,${0.3*(1-prog)})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(px,py);ctx.stroke();
    // packet
    ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,215,0,${0.8+0.2*Math.sin(t*5+i)})`;
    ctx.shadowColor='#ffd700';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
    // origin flag
    const flags=['🇬🇧','🇺🇸','🇨🇦','🇦🇪','🇩🇪'];
    ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText(flags[i],sx,sy-8);
  });
  
  // Live stat counters
  ctx.fillStyle='#00d4ff';ctx.font='bold 12px Segoe UI';ctx.textAlign='center';
  ctx.fillText('UNBANKED: '+unbanked.toLocaleString(),cx,H-48);
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='10px Segoe UI';
  ctx.fillText('$26B REMITTANCES · 0% IN VERIFIED RE INVESTMENT',cx,H-30);
  ctx.fillText('BETONIQ INVEST SOLVES THIS NOW',cx,H-14);
}

function anim_person(t){
  const W=cvs.width,H=cvs.height,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=BKGS[1];ctx.fillRect(0,0,W,H);
  
  // Manchester skyline left
  ctx.fillStyle='rgba(255,107,157,0.12)';
  [[0,.6,.1,.42],[.08,.65,.08,.37],[.16,.58,.1,.45],[.26,.62,.08,.4]].forEach(([bx,by,bw,bh])=>ctx.fillRect(bx*W,by*H,bw*W,bh*H));
  
  // Abuja skyline right (greener)
  ctx.fillStyle='rgba(0,230,118,0.12)';
  [[.62,.58,.1,.45],[.72,.63,.08,.4],[.8,.55,.1,.48],[.9,.62,.08,.4]].forEach(([bx,by,bw,bh])=>ctx.fillRect(bx*W,by*H,bw*W,bh*H));
  
  // David figure — pulsing
  const pulse=1+0.03*Math.sin(t*2);
  ctx.save();ctx.translate(cx*.55,cy*.8);ctx.scale(pulse,pulse);
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(0,-40,18,0,Math.PI*2);ctx.fill(); // head
  ctx.fillRect(-14,-22,28,40); // body
  ctx.fillRect(-26,-18,13,30); // left arm
  ctx.fillRect(13,-18,13,30); // right arm
  ctx.fillRect(-12,16,11,26); // left leg
  ctx.fillRect(1,16,11,26); // right leg
  ctx.restore();
  
  // BLOCKED money — animated red X pulsing
  const blockPulse=0.8+0.2*Math.sin(t*3);
  ctx.save();ctx.translate(cx*.25,cy*.9);ctx.scale(blockPulse,blockPulse);
  ctx.strokeStyle='#ff5252';ctx.lineWidth=4;ctx.shadowColor='#ff5252';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(-20,-20);ctx.lineTo(20,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(20,-20);ctx.lineTo(-20,20);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,82,82,.15)';ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff5252';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';ctx.fillText('£12,000',0,38);ctx.fillText('LOST',0,51);
  ctx.restore();
  
  // QUESTION MARKS bouncing around David
  ['?','?','?'].forEach((q,i)=>{
    const qx=cx*.55+60*Math.cos(t*.8+i*2.1),qy=cy*.8-50+20*Math.sin(t*1.2+i*1.5);
    const qScale=0.7+0.3*Math.sin(t*2+i);
    ctx.fillStyle=`rgba(255,107,157,${0.6+0.4*Math.sin(t+i)})`;
    ctx.font=`bold ${Math.round(24*qScale)}px Segoe UI`;ctx.textAlign='center';
    ctx.shadowColor='#ff6b9d';ctx.shadowBlur=8;ctx.fillText(q,qx,qy);ctx.shadowBlur=0;
  });
  
  // Live poverty counter ticking
  ctx.fillStyle='#ff6b9d';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';
  ctx.fillText('DIASPORA INVESTING BLIND: '+(47000000+Math.floor(t*100)).toLocaleString()+' CASES/YEAR',cx,H-30);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='9px Segoe UI';
  ctx.fillText('BETONIQ INVEST GIVES DAVID VERIFIED DATA FOR THE FIRST TIME',cx,H-14);
}

function anim_stats(t){
  const W=cvs.width,H=cvs.height,cx=W/2;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=BKGS[2];ctx.fillRect(0,0,W,H);
  
  // LIVE STAT COUNTERS — numbers counting up
  const stats=[
    {label:'LIVE PROJECTS',val:70,unit:'',target:70,color:'#ffa500'},
    {label:'COUNTRIES',val:11,unit:'',target:11,color:'#00e676'},
    {label:'PIPELINE VALUE',val:5.1,unit:'B',target:5.1,color:'#40c4ff'},
    {label:'AVG AI SCORE',val:89,unit:'/100',target:89,color:'#ea80fc'},
    {label:'AVG PROJ ROI',val:29,unit:'%',target:29,color:'#ffd740'},
    {label:'MIN COMPLIANCE',val:80,unit:'/100',target:80,color:'#69f0ae'}
  ];
  
  const cardW=(W-40)/3,cardH=(H-60)/2;
  stats.forEach((s,i)=>{
    const col=i%3,row=Math.floor(i/3);
    const cx2=20+col*(cardW+6)+cardW/2,cy2=20+row*(cardH+6)+cardH/2;
    
    // Card background with pulse
    const pulseAlpha=0.08+0.04*Math.sin(t*2+i);
    ctx.fillStyle=s.color.replace(')',`, ${pulseAlpha})`).replace('rgb','rgba');
    if(!s.color.startsWith('rgba')){
      // parse hex
      const r=parseInt(s.color.slice(1,3),16),g=parseInt(s.color.slice(3,5),16),b=parseInt(s.color.slice(5,7),16);
      ctx.fillStyle=`rgba(${r},${g},${b},${pulseAlpha})`;
    }
    ctx.beginPath();ctx.roundRect(cx2-cardW/2+3,cy2-cardH/2+3,cardW-6,cardH-6,10);ctx.fill();
    ctx.strokeStyle=s.color+'66';ctx.lineWidth=1.5;ctx.stroke();
    
    // Animated value — counts up from 0
    const progress=Math.min(1,t*.5);
    const displayVal=s.val*progress;
    const displayStr=s.val<10?displayVal.toFixed(1):Math.round(displayVal).toString();
    
    ctx.fillStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=12;
    ctx.font=`bold ${Math.min(cardW*.32,36)}px Segoe UI`;ctx.textAlign='center';
    ctx.fillText(displayStr+s.unit,cx2,cy2+6);ctx.shadowBlur=0;
    
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.font=`bold ${Math.min(cardW*.09,10)}px Segoe UI`;
    ctx.fillText(s.label,cx2,cy2-cardH*.25);
    
    // Progress ring
    const angle=-Math.PI/2;
    ctx.beginPath();ctx.arc(cx2,cy2-cardH*.1,cardH*.12,angle,angle+Math.PI*2*progress);
    ctx.strokeStyle=s.color+'44';ctx.lineWidth=3;ctx.stroke();
  });

function anim_steps(t){
  const W=cvs.width,H=cvs.height,cx=W/2;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=BKGS[5];ctx.fillRect(0,0,W,H);
  
  const steps=[
    {label:'KYC VERIFIED',sub:'Identity checked · AML cleared · 24hrs',color:'#00b0ff'},
    {label:'£15,000 COMMITTED',sub:'Katampe Terrace selected',color:'#7c4dff'},
    {label:'CONTRACT SIGNED',sub:'Digital · encrypted · timestamped',color:'#00e676'},
    {label:'MILESTONE RELEASE',sub:'5 tranches · never lump sum',color:'#ff9800'},
    {label:'£4,200 RETURNED',sub:'28% exactly as projected',color:'#ffd740'}
  ];
  
  // Animated progress — which step is active
  const activeStep=Math.floor(t*.5)%6;
  
  steps.forEach((s,i)=>{
    const done=i<activeStep,active=i===activeStep;
    const stepH=H*.16,stepY=H*.04+i*stepH;
    
    // Connector line
    if(i<steps.length-1){
      const lineProgress=done?1:active?(t*.5-activeStep)*.8:0;
      ctx.strokeStyle=steps[i].color+'44';ctx.lineWidth=2;ctx.setLineDash([4,6]);
      ctx.beginPath();ctx.moveTo(W*.12,stepY+stepH*.5);ctx.lineTo(W*.12,stepY+stepH*.9*lineProgress+stepH*.5);ctx.stroke();
      ctx.setLineDash([]);
    }
    
    // Step circle
    const r=active?22:done?18:15;
    ctx.beginPath();ctx.arc(W*.12,stepY+stepH*.4,r,0,Math.PI*2);
    if(active){ctx.fillStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=20;}
    else if(done){ctx.fillStyle=s.color+'88';ctx.shadowColor=s.color;ctx.shadowBlur=8;}
    else ctx.fillStyle='rgba(255,255,255,.08)';
    ctx.fill();ctx.shadowBlur=0;
    
    if(active){// outer ring pulse
      ctx.beginPath();ctx.arc(W*.12,stepY+stepH*.4,r+8+5*Math.sin(t*4),0,Math.PI*2);
      ctx.strokeStyle=s.color+'44';ctx.lineWidth=2;ctx.stroke();
    }
    
    ctx.fillStyle=done||active?'#000':'rgba(255,255,255,.4)';
    ctx.font=`bold ${active?12:10}px Segoe UI`;ctx.textAlign='center';
    ctx.fillText(done?'✓':String(i+1),W*.12,stepY+stepH*.4+5);
    
    // Label
    const labelAlpha=done?0.7:active?1:0.3;
    ctx.fillStyle=`rgba(255,255,255,${labelAlpha})`;
    ctx.font=`bold ${active?12:10}px Segoe UI`;ctx.textAlign='left';
    ctx.fillText(s.label,W*.2,stepY+stepH*.35);
    ctx.fillStyle=`rgba(255,255,255,${labelAlpha*.6})`;ctx.font='9px Segoe UI';
    ctx.fillText(s.sub,W*.2,stepY+stepH*.55);
    
    if(done){
      ctx.fillStyle=s.color;ctx.font='bold 14px Arial';ctx.textAlign='right';ctx.fillText('✓',W-.12*W,stepY+stepH*.4+5);
    }
  });
  
  ctx.fillStyle='#ffd740';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';

function anim_growth(t){
  const W=cvs.width,H=cvs.height,cx=W/2;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=BKGS[10];ctx.fillRect(0,0,W,H);
  
  // Live animated growth chart
  const padL=50,padR=20,padT=30,padB=40;
  const chartW=W-padL-padR,chartH=H-padT-padB;
  
  // Grid
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){
    const y=padT+chartH*(1-i/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='8px Segoe UI';ctx.textAlign='right';
    ctx.fillText('$'+(i*14)+'M',padL-4,y+3);
  }
  
  // Animated S-curve growing over time
  const points=[];
  for(let x=0;x<=chartW;x+=5){
    const xFrac=x/chartW;
    const yVal=55*Math.pow(xFrac,2.2);
    const yPos=padT+chartH*(1-Math.min(1,yVal/55));
    points.push({x:padL+x,y:yPos});
  }
  const progress=Math.min(1,t*.35);
  const visPoints=Math.floor(points.length*progress);
  
  if(visPoints>1){
    // Fill area
    ctx.beginPath();ctx.moveTo(padL,padT+chartH);
    points.slice(0,visPoints).forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.lineTo(points[visPoints-1].x,padT+chartH);ctx.closePath();
    const areaGrad=ctx.createLinearGradient(0,padT,0,padT+chartH);
    areaGrad.addColorStop(0,'rgba(255,100,0,.3)');areaGrad.addColorStop(1,'rgba(255,100,0,.02)');
    ctx.fillStyle=areaGrad;ctx.fill();
    
    // Line
    ctx.beginPath();points.slice(0,visPoints).forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.strokeStyle='#ff6d00';ctx.lineWidth=2.5;ctx.shadowColor='#ff6d00';ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
    
    // Current point glow
    const lp=points[visPoints-1];
    ctx.beginPath();ctx.arc(lp.x,lp.y,6,0,Math.PI*2);
    ctx.fillStyle='#ffd740';ctx.shadowColor='#ffd740';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;
    
    // Revenue label
    const curRev=(55*Math.pow(progress,2.2)).toFixed(1);
    ctx.fillStyle='#ffd740';ctx.font='bold 11px Segoe UI';ctx.textAlign='left';
    ctx.fillText('$'+curRev+'M',lp.x+8,lp.y+4);
  }
  
  // Phase markers
  [[.33,'2026','$3.1M'],[.66,'2027','$16M'],[1,'2028','$55M']].forEach(([frac,yr,val])=>{
    const x=padL+chartW*frac;
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.setLineDash([3,5]);
    ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,padT+chartH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='bold 9px Segoe UI';ctx.textAlign='center';
    ctx.fillText(yr,x,padT+chartH+16);ctx.fillText(val,x,padT+chartH+28);
  });
  
  ctx.fillStyle='#ffd740';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';
  ctx.fillText('CUMULATIVE REVENUE TRAJECTORY TO $55M · 72% GROSS MARGIN',cx,H-4);
}

function anim_finale(t){
  const W=cvs.width,H=cvs.height,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=BKGS[14];ctx.fillRect(0,0,W,H);
  
  // Rotating golden rays
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2+t*.15;
    const r=Math.min(W,H)*.45;
    const alpha=.06+.04*Math.sin(t*2+i);
    ctx.strokeStyle=`rgba(255,215,0,${alpha})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();
  }
  
  // Orbiting stats
  const statItems=[
    {l:'70 PROJECTS',c:'#ffd740'},{l:'$5.1B PIPELINE',c:'#ff9800'},{l:'29% AVG ROI',c:'#ff5252'},
    {l:'47-PARAM AI',c:'#ea80fc'},{l:'11 COUNTRIES',c:'#00e676'},{l:'89/100 AVG SCORE',c:'#40c4ff'}
  ];
  const orbitR=Math.min(W,H)*.37;
  statItems.forEach((s,i)=>{
    const a=(i/statItems.length)*Math.PI*2+t*.2;
    const sx=cx+Math.cos(a)*orbitR,sy=cy+Math.sin(a)*orbitR;
    // Trail
    for(let tr=1;tr<=5;tr++){
      const ta=a-tr*.04;
      const tx=cx+Math.cos(ta)*orbitR,ty=cy+Math.sin(ta)*orbitR;
      ctx.beginPath();ctx.arc(tx,ty,2*(1-tr/5),0,Math.PI*2);
      ctx.fillStyle=s.c+Math.round((1-tr/5)*88).toString(16).padStart(2,'0');ctx.fill();
    }
    ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);
    ctx.fillStyle=s.c;ctx.shadowColor=s.c;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle=s.c;ctx.font='bold 9px Segoe UI';ctx.textAlign='center';ctx.fillText(s.l,sx,sy-12);
  });
  
  // Pulsing central star
  function drawStar5(r1,r2,rot){
    ctx.beginPath();
    for(let i=0;i<10;i++){const r=i%2===0?r1:r2,a=(i/5)*Math.PI+rot;i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
    ctx.closePath();
  }
  const sp=.92+.08*Math.sin(t*2.5);
  drawStar5(65*sp,30*sp,-Math.PI/2+t*.08);
  const sg=ctx.createRadialGradient(cx,cy,5,cx,cy,65);
  sg.addColorStop(0,'#fff9c4');sg.addColorStop(.4,'#ffd740');sg.addColorStop(.8,'#ffa500');sg.addColorStop(1,'#ff6f00');
  ctx.fillStyle=sg;ctx.shadowColor='#ffd740';ctx.shadowBlur=30;ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';ctx.fillText('JOIN US',cx,cy+5);
  
  ctx.fillStyle='#ffd740';ctx.shadowColor='#ffd740';ctx.shadowBlur=8;ctx.font='bold 11px Segoe UI';ctx.textAlign='center';
  ctx.fillText('THE BLOOMBERG OF AFRICAN REAL ESTATE — INVEST NOW',cx,H-10);ctx.shadowBlur=0;
}

function runAnim(){
  T+=.016;
  ctx.clearRect(0,0,cvs.width,cvs.height);

}

// Status
function setStatus(state,text){
  const dot=document.getElementById('ndot');const ntxt=document.getElementById('ntext');
  dot.className='ndot'+(state==='speaking'?' on':'');
  dot.style.background=state==='done'?'#00e676':state==='speaking'?'#fff':ACCENTS[cur];
  ntxt.textContent=text;
}

function onEnd(i){playing=false;setStatus('done','✅ Narration complete — OpenAI Shimmer');document.getElementById('playBtn').textContent='▶ PLAY';if(autoAdvance&&i<TOTAL-1)setTimeout(()=>{jumpTo(i+1);playSlide(i+1);},850);else if(autoAdvance){autoAdvance=false;document.getElementById('autoBtn').textContent='AUTO: OFF';}}
function onErr(i){playing=false;setStatus('error','⚠ Tap PLAY again');document.getElementById('playBtn').textContent='▶ PLAY';}
function stopAll(){audEls.forEach(a=>{try{a.pause();a.currentTime=0;}catch(e){}});playing=false;}
function playSlide(i){stopAll();const a=audEls[i];if(!a)return;a.preload='auto';playing=true;document.getElementById('playBtn').textContent='⏸ PAUSE';setStatus('speaking','🎙️ OpenAI Shimmer professional female narration playing...');if(audEls[i+1])audEls[i+1].preload='auto';a.play().catch(()=>{playing=false;setStatus('error','⚠ Tap ▶ PLAY (browser audio policy)');document.getElementById('playBtn').textContent='▶ PLAY';});}
function togglePlay(){if(playing){stopAll();document.getElementById('playBtn').textContent='▶ PLAY';setStatus('idle','▶ PLAY NARRATION — OpenAI Shimmer voice');return;}playSlide(cur);}
function toggleAuto(){autoAdvance=!autoAdvance;document.getElementById('autoBtn').textContent='AUTO: '+(autoAdvance?'ON':'OFF');document.getElementById('autoBtn').style.background=autoAdvance?'rgba(255,255,255,.12)':'';if(autoAdvance&&!playing)playSlide(cur);}

function applyTheme(){
  const acc=ACCENTS[cur],bg=BKGS[cur];
  document.getElementById('hdr').style.background=bg;
  document.getElementById('hdr').style.borderBottom=`2px solid ${acc}55`;
  document.getElementById('brandName').style.color=acc;
  document.getElementById('sCount').style.color=acc;
  document.getElementById('sNum').style.color=acc;
  document.getElementById('sTitle').style.color=acc;
  document.getElementById('narrPill').style.borderColor=acc+'88';
  document.getElementById('narrPill').style.color=acc;
  document.getElementById('ndot').style.background=acc;
  document.getElementById('playBtn').style.background=`linear-gradient(135deg,${acc},${ACCENTS[(cur+1)%TOTAL]})`;
  document.getElementById('prog').style.background=acc;
  document.getElementById('prog').style.width=(((cur+1)/TOTAL)*100)+'%';
  ['th','dt'].forEach(pfx=>TITLES.forEach((_,i)=>{
    const el=document.getElementById(pfx+i);if(!el)return;
    el.className=(pfx==='th'?'thumb':'dot')+(i===cur?' active':i<cur?' done':'');
    if(i===cur){el.style.color=ACCENTS[i];if(pfx==='dt')el.style.background=ACCENTS[i];}
    else{el.style.color='';if(pfx==='dt')el.style.background='';}
  }));
  document.getElementById('th'+cur)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function updateUI(){
  document.getElementById('sCount').textContent=(cur+1)+' / '+TOTAL;
  document.getElementById('sNum').textContent='SLIDE '+String(cur+1).padStart(2,'0')+' / '+TOTAL;
  document.getElementById('sTitle').textContent=TITLES[cur];
  document.getElementById('sText').textContent=SLIDES[cur];
  document.getElementById('playBtn').textContent='▶ PLAY';
  setStatus('idle','▶ PLAY NARRATION — OpenAI Shimmer voice');
  applyTheme();
}

function go(dir){const next=Math.max(0,Math.min(TOTAL-1,cur+dir));if(next===cur)return;const was=playing||autoAdvance;jumpTo(next);if(was)playSlide(next);}
function jumpTo(idx){stopAll();cur=idx;T=0;updateUI();}

updateUI();runAnim();

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key.toLowerCase()==='p')togglePlay();
  else if(e.key.toLowerCase()==='a')toggleAuto();
});
let tx=0;
document.getElementById('main-wrap'||'animCol').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.getElementById('animCol').addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientX-tx)>60)go(e.changedTouches[0].clientX<tx?1:-1);},{passive:true});
</script>
</body>
</html>
